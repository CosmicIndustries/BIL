<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>BIL Helper</title>
    <style>
      body {
        font: 13px sans-serif;
        width: 280px;
        padding: 10px;
        color: #eee;
        background: #1e1e1e;
      }
      label {
        display: block;
        margin-top: 8px;
        font-weight: bold;
      }
      input {
        width: 100%;
        box-sizing: border-box;
        padding: 4px;
        margin-top: 2px;
        background: #2a2a2a;
        color: #eee;
        border: 1px solid #444;
        border-radius: 4px;
      }
      button {
        margin-top: 10px;
        width: 100%;
        padding: 6px;
        cursor: pointer;
      }
      #status {
        margin-top: 6px;
        min-height: 1em;
        color: #8f8;
      }
      p {
        margin: 4px 0 0;
        color: #aaa;
      }
    </style>
  </head>
  <body>
    <label for="endpoint">BIL endpoint</label>
    <input id="endpoint" placeholder="http://127.0.0.1:8787/bil" />

    <label for="token">Auth token</label>
    <input id="token" placeholder="printed by server.py on startup" />

    <button id="save">Save</button>
    <div id="status"></div>
    <p>Select text on a page, press Alt+B.</p>
    <script src="popup.js"></script>
  </body>
</html>
