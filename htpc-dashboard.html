<title>Phase Console</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Big+Shoulders+Display:wght@700;800&display=swap');

  :root {
    --bg: #0b0e14;
    --surface: #131820;
    --surface-raised: #1a2030;
    --surface-bright: #212b3a;
    --border: #1e2a3a;
    --border-focus: #2d3f56;
    --text: #c4cdd8;
    --text-bright: #eaf0f6;
    --text-secondary: #7a8a9e;
    --prompt: #f0a830;
    --prompt-bg: rgba(240,168,48,0.1);
    --prompt-border: rgba(240,168,48,0.25);
    --success: #34d399;
    --success-bg: rgba(52,211,153,0.1);
    --success-border: rgba(52,211,153,0.2);
    --warn: #fbbf24;
    --warn-bg: rgba(251,191,36,0.08);
    --error: #f87171;
    --error-bg: rgba(248,113,113,0.1);
    --info: #60a5fa;
    --info-bg: rgba(96,165,250,0.08);
    color-scheme: dark;
  }
  @media (prefers-color-scheme: light) {
    :root:not([data-theme="dark"]) {
      --bg: #f4f2ed; --surface: #ffffff; --surface-raised: #f9f8f5;
      --surface-bright: #eeece6; --border: #ddd9d0; --border-focus: #c5c0b4;
      --text: #3a3630; --text-bright: #1c1a16; --text-secondary: #7a7568;
      --prompt: #b07010; --prompt-bg: rgba(176,112,16,0.08);
      --prompt-border: rgba(176,112,16,0.2); --success: #16a34a;
      --success-bg: rgba(22,163,74,0.06); --success-border: rgba(22,163,74,0.15);
      --warn: #ca8a04; --warn-bg: rgba(202,138,4,0.06);
      --error: #dc2626; --error-bg: rgba(220,38,38,0.06);
      --info: #2563eb; --info-bg: rgba(37,99,235,0.05);
      --btn-bg: #f0ede6; --btn-bg-hover: #e6e2d8; --input-bg: #faf9f6;
      color-scheme: light;
    }
  }
  :root[data-theme="dark"] { color-scheme: dark; }
  :root[data-theme="light"] {
    --bg: #f4f2ed; --surface: #ffffff; --surface-raised: #f9f8f5;
    --surface-bright: #eeece6; --border: #ddd9d0; --border-focus: #c5c0b4;
    --text: #3a3630; --text-bright: #1c1a16; --text-secondary: #7a7568;
    --prompt: #b07010; --prompt-bg: rgba(176,112,16,0.08);
    --prompt-border: rgba(176,112,16,0.2); --success: #16a34a;
    --success-bg: rgba(22,163,74,0.06); --success-border: rgba(22,163,74,0.15);
    --warn: #ca8a04; --warn-bg: rgba(202,138,4,0.06);
    --error: #dc2626; --error-bg: rgba(220,38,38,0.06);
    --info: #2563eb; --info-bg: rgba(37,99,235,0.05);
    --btn-bg: #f0ede6; --btn-bg-hover: #e6e2d8; --input-bg: #faf9f6;
    color-scheme: light;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
    font-size: 14px;
    line-height: 1.5;
    padding-inline: 16px;
    padding-block: 0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    max-width: 520px;
    margin: 0 auto;
    -webkit-user-select: none;
    user-select: none;
  }

  /* ── Header ── */
  .header {
    padding: 16px 0 12px;
    position: sticky;
    top: env(safe-area-inset-top, 0px);
    background: var(--bg);
    z-index: 10;
  }
  .header-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 12px;
  }
  .wordmark {
    font-family: 'Big Shoulders Display', system-ui, sans-serif;
    font-weight: 800; font-size: 22px;
    color: var(--text-bright);
    letter-spacing: 0.02em;
  }
  .wordmark span { color: var(--prompt); }
  .header-meta {
    display: flex; align-items: center; gap: 8px;
    font-size: 12px; color: var(--text-secondary);
  }
  .conn-pill {
    display: inline-flex; align-items: center; gap: 5px;
    font-size: 11px; font-weight: 600;
    padding: 4px 10px; border-radius: 99px;
    letter-spacing: 0.03em;
  }
  .conn-pill.on {
    background: var(--success-bg); color: var(--success);
    border: 1px solid var(--success-border);
  }
  .conn-pill.off {
    background: var(--error-bg); color: var(--error);
    border: 1px solid rgba(248,113,113,0.2);
  }
  .conn-pill .dot {
    width: 6px; height: 6px; border-radius: 50%;
    background: currentColor;
  }

  /* ── Host tabs ── */
  .host-bar {
    display: flex; gap: 6px; align-items: center;
    overflow-x: auto; -webkit-overflow-scrolling: touch;
    scrollbar-width: none; padding-bottom: 2px;
  }
  .host-bar::-webkit-scrollbar { display: none; }
  .host-tab {
    display: inline-flex; align-items: center; gap: 6px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 8px 14px;
    font-family: inherit; font-size: 13px; font-weight: 500;
    color: var(--text-secondary);
    cursor: pointer; white-space: nowrap;
    transition: all 0.15s;
  }
  .host-tab:active { transform: scale(0.97); }
  .host-tab.active {
    background: var(--prompt-bg);
    border-color: var(--prompt-border);
    color: var(--prompt);
  }
  .host-tab .hdot {
    width: 7px; height: 7px; border-radius: 50%;
    background: var(--text-secondary); opacity: 0.4;
  }
  .host-tab.active .hdot { background: var(--prompt); opacity: 1; }
  .host-tab.connected .hdot { background: var(--success); opacity: 1; }
  .add-host-tab {
    display: inline-flex; align-items: center; justify-content: center;
    width: 36px; height: 36px; flex-shrink: 0;
    background: var(--surface);
    border: 1px dashed var(--border);
    border-radius: 10px;
    font-size: 18px; color: var(--text-secondary);
    cursor: pointer;
  }
  .add-host-tab:active { transform: scale(0.95); }

  /* ── Sections ── */
  .section {
    margin-top: 16px;
  }
  .section-label {
    font-size: 10px; font-weight: 700;
    letter-spacing: 0.1em; text-transform: uppercase;
    color: var(--text-secondary);
    margin-bottom: 8px;
    padding-left: 2px;
  }

  /* ── Control cards ── */
  .controls {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
  }
  .ctrl-btn {
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 6px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 16px 10px;
    cursor: pointer;
    transition: all 0.15s;
    min-height: 80px;
    text-align: center;
  }
  .ctrl-btn:active { transform: scale(0.96); background: var(--surface-raised); }
  .ctrl-btn:focus-visible { outline: 2px solid var(--info); outline-offset: 2px; }
  .ctrl-btn .icon {
    font-size: 24px; line-height: 1;
  }
  .ctrl-btn .label {
    font-family: inherit; font-size: 12px; font-weight: 600;
    color: var(--text-bright);
    letter-spacing: 0.01em;
  }
  .ctrl-btn .sub {
    font-size: 10px; color: var(--text-secondary);
    margin-top: -2px;
  }
  .ctrl-btn.wide {
    grid-column: 1 / -1;
    flex-direction: row;
    gap: 12px;
    padding: 14px 18px;
    min-height: auto;
    text-align: left;
  }
  .ctrl-btn.wide .labels { display: flex; flex-direction: column; }
  .ctrl-btn.accent {
    background: var(--prompt-bg);
    border-color: var(--prompt-border);
  }
  .ctrl-btn.accent .icon { color: var(--prompt); }
  .ctrl-btn.success-tint {
    background: var(--success-bg);
    border-color: var(--success-border);
  }
  .ctrl-btn.success-tint .icon { color: var(--success); }

  /* ── Output panel ── */
  .output-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    overflow: hidden;
  }
  .output-header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 10px 14px;
    border-bottom: 1px solid var(--border);
  }
  .output-header span {
    font-size: 11px; font-weight: 600; color: var(--text-secondary);
    letter-spacing: 0.04em; text-transform: uppercase;
  }
  .output-clear {
    background: none; border: none;
    font-family: inherit; font-size: 11px;
    color: var(--text-secondary); cursor: pointer;
    padding: 2px 6px;
  }
  .output-clear:hover { color: var(--text); }
  .output-body {
    padding: 10px 14px;
    max-height: 180px;
    overflow-y: auto;
    font-family: 'Inter', monospace;
    font-size: 11.5px;
    line-height: 1.55;
    color: var(--text);
    -webkit-user-select: text;
    user-select: text;
  }
  .output-body:empty::after {
    content: "Run a command to see output here";
    color: var(--text-secondary);
    font-style: italic;
  }
  .output-body .o-cmd {
    color: var(--prompt); font-weight: 500;
    margin-top: 6px;
  }
  .output-body .o-cmd:first-child { margin-top: 0; }
  .output-body .o-line { color: var(--text); }
  .output-body .o-ok { color: var(--success); }
  .output-body .o-warn { color: var(--warn); }
  .output-body .o-val { color: var(--text-bright); font-weight: 500; }

  /* ── Tip banner ── */
  .tip-banner {
    display: flex; align-items: flex-start; gap: 10px;
    background: var(--info-bg);
    border: 1px solid rgba(96,165,250,0.15);
    border-radius: 12px;
    padding: 12px 14px;
    margin-top: 16px;
    font-size: 12.5px;
    color: var(--text);
    line-height: 1.5;
  }
  .tip-banner .tip-icon {
    font-size: 16px; flex-shrink: 0; margin-top: 1px;
  }
  .tip-banner .tip-text strong { color: var(--text-bright); font-weight: 600; }
  .tip-banner .dismiss {
    background: none; border: none;
    color: var(--text-secondary); font-size: 16px;
    cursor: pointer; padding: 0; margin-left: auto;
    flex-shrink: 0; line-height: 1;
  }
  .tip-banner .dismiss:hover { color: var(--text); }

  /* ── Connect modal ── */
  .modal-overlay {
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.6);
    z-index: 100;
    display: flex; align-items: flex-end; justify-content: center;
    padding: 16px;
  }
  .modal-overlay[hidden] { display: none; }
  .modal {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 20px 20px 14px 14px;
    width: 100%; max-width: 420px;
    padding: 20px;
  }
  .modal h3 {
    font-size: 16px; font-weight: 700;
    color: var(--text-bright);
    margin: 0 0 4px;
  }
  .modal p {
    font-size: 12.5px; color: var(--text-secondary);
    margin: 0 0 16px;
  }
  .modal-field {
    display: flex; flex-direction: column; gap: 6px;
    margin-bottom: 12px;
  }
  .modal-field label {
    font-size: 11px; font-weight: 600;
    color: var(--text-secondary);
    letter-spacing: 0.04em; text-transform: uppercase;
  }
  .modal-field input {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px 14px;
    font-family: inherit; font-size: 14px;
    color: var(--text);
    outline: none;
  }
  .modal-field input:focus { border-color: var(--prompt-border); }
  .modal-field input::placeholder { color: var(--text-secondary); }
  .modal-actions {
    display: flex; gap: 8px; margin-top: 16px;
  }
  .modal-actions button {
    flex: 1; padding: 12px;
    border-radius: 10px;
    font-family: inherit; font-size: 14px; font-weight: 600;
    cursor: pointer; border: none;
  }
  .modal-actions .cancel {
    background: var(--surface-bright);
    color: var(--text);
  }
  .modal-actions .connect {
    background: var(--prompt);
    color: var(--bg);
  }
  .modal-actions button:active { transform: scale(0.98); }

  /* ── Footer spacing ── */
  .footer-space { height: 24px; flex-shrink: 0; }

  @media (min-width: 520px) {
    .controls { grid-template-columns: 1fr 1fr 1fr; }
  }
</style>

<div class="header">
  <div class="header-top">
    <div class="wordmark">PHASE<span>·</span>CONSOLE</div>
    <div class="header-meta">
      <span id="clock">--:--</span>
      <div class="conn-pill off" id="connPill">
        <div class="dot"></div>
        <span id="connText">offline</span>
      </div>
    </div>
  </div>
  <div class="host-bar" id="hostBar"></div>
</div>

<div id="app"></div>

<div class="modal-overlay" id="addModal" hidden>
  <div class="modal">
    <h3>Add Host</h3>
    <p>Enter the SSH connection for your machine.</p>
    <div class="modal-field">
      <label>User</label>
      <input type="text" id="modalUser" placeholder="htpc" autocomplete="off" autocapitalize="off" spellcheck="false">
    </div>
    <div class="modal-field">
      <label>Hostname / IP</label>
      <input type="text" id="modalHost" placeholder="192.168.1.100" autocomplete="off" autocapitalize="off" spellcheck="false">
    </div>
    <div class="modal-field">
      <label>Label (optional)</label>
      <input type="text" id="modalLabel" placeholder="Living room HTPC" autocomplete="off" spellcheck="false">
    </div>
    <div class="modal-actions">
      <button class="cancel" id="modalCancel">Cancel</button>
      <button class="connect" id="modalConnect">Add Host</button>
    </div>
  </div>
</div>

<script>
(function () {
  "use strict";

  // ── State ──
  let hosts = loadHosts();
  let activeHostIdx = 0;
  let connected = {};
  let outputs = {};
  let tipDismissed = false;
  try { tipDismissed = localStorage.getItem("pc_tip_dismissed") === "1"; } catch(e) {}

  const TIPS = [
    { icon: "💡", html: '<strong>Tip:</strong> Tap a command button to run it on the selected host. Output appears at the bottom.' },
    { icon: "🎵", html: '<strong>Audio:</strong> Use <strong>Detect</strong> to check your system\'s sample rate and format, then <strong>Render</strong> to generate a matched session.' },
    { icon: "⚡", html: '<strong>Quick start:</strong> Detect → Render → Play. Three taps to an entrainment session matched to your HTPC\'s native audio.' },
    { icon: "🔗", html: '<strong>Hosts:</strong> Tap <strong>+</strong> to add a new machine. Your saved hosts are remembered between visits.' },
  ];
  let currentTip = Math.floor(Math.random() * TIPS.length);

  function loadHosts() {
    try {
      const raw = localStorage.getItem("pc_hosts");
      if (raw) return JSON.parse(raw);
    } catch(e) {}
    return [{ user:"htpc", host:"htpc", label:"HTPC" }];
  }
  function saveHosts() {
    try { localStorage.setItem("pc_hosts", JSON.stringify(hosts)); } catch(e) {}
  }

  function esc(s) { return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }

  // ── Simulated outputs ──
  const SIMS = {
    "detect": [
      { cls:"o-cmd", text:"$ pactl info | grep -E 'Server|Default Sink'" },
      { cls:"o-line", text:"Server Name: PipeWire (version 1.0)" },
      { cls:"o-val", text:"Default Sink: alsa_output.pci-0000_00_1f.3.hdmi-stereo" },
      { cls:"o-cmd", text:"$ pactl list sinks short" },
      { cls:"o-val", text:"60  hdmi-stereo  PipeWire  s32le 2ch 48000Hz  RUNNING" },
    ],
    "volume": [
      { cls:"o-cmd", text:"$ pactl get-sink-volume @DEFAULT_SINK@" },
      { cls:"o-val", text:"Volume: L 40% / R 40%  (-23.88 dB)" },
      { cls:"o-cmd", text:"$ pactl get-sink-mute @DEFAULT_SINK@" },
      { cls:"o-ok", text:"Mute: no" },
    ],
    "info": [
      { cls:"o-cmd", text:"$ python3 -m vibroacoustic_entrainment.cli --show-audio-info" },
      { cls:"o-line", text:"System audio output:" },
      { cls:"o-val", text:"  Sink:    hdmi-stereo (PipeWire)" },
      { cls:"o-val", text:"  Rate:    48000 Hz" },
      { cls:"o-val", text:"  Format:  s32le (32-bit)" },
      { cls:"o-val", text:"  Ch:      2    Vol: 40%    Muted: no" },
    ],
    "render": [
      { cls:"o-cmd", text:"$ python3 -m vibroacoustic_entrainment.cli --match-system --protocol focus10 --out-dir ~/entrainment_out/" },
      { cls:"o-ok", text:"  -> Using: 48000 Hz, 32-bit" },
      { cls:"o-val", text:"Rendered 'gateway_focus10' (1800s) -> ~/entrainment_out/" },
      { cls:"o-line", text:"  audio.wav  haptic.wav  photic_events.json" },
    ],
    "play": [
      { cls:"o-cmd", text:"$ paplay ~/entrainment_out/audio.wav &" },
      { cls:"o-ok", text:"▶ Playing gateway_focus10 — 30:00" },
    ],
    "stop": [
      { cls:"o-cmd", text:"$ pkill paplay" },
      { cls:"o-warn", text:"■ Stopped playback" },
    ],
    "uptime": [
      { cls:"o-cmd", text:"$ uptime -p && uname -r" },
      { cls:"o-val", text:"up 14 days, 7:23" },
      { cls:"o-line", text:"6.18.44-fc-v37" },
    ],
    "memory": [
      { cls:"o-cmd", text:"$ free -h | head -2" },
      { cls:"o-line", text:"              total    used     free     available" },
      { cls:"o-val", text:"Mem:          16Gi     6.2Gi    4.1Gi    9.2Gi" },
    ],
    "disk": [
      { cls:"o-cmd", text:"$ df -h / /home | tail -2" },
      { cls:"o-val", text:"/   468G  142G  302G  32%" },
      { cls:"o-val", text:"/home  931G  89G  798G  10%" },
    ],
    "temp": [
      { cls:"o-cmd", text:"$ sensors | grep 'Core 0'" },
      { cls:"o-ok", text:"Core 0: +42.0°C  (high +100°C)" },
    ],
    "top": [
      { cls:"o-cmd", text:"$ ps aux --sort=-%mem | head -5" },
      { cls:"o-warn", text:"htpc  1842  2.1%  8.4%  /usr/bin/kodi" },
      { cls:"o-line", text:"htpc  2103  0.8%  3.2%  pipewire" },
      { cls:"o-line", text:"htpc  1201  0.3%  1.8%  Xwayland" },
      { cls:"o-line", text:"root   412  0.0%  0.4%  systemd" },
    ],
  };

  // ── Render ──
  const app = document.getElementById("app");
  const hostBar = document.getElementById("hostBar");

  function render() {
    const h = hosts[activeHostIdx];
    const isConn = !!connected[activeHostIdx];

    // Connection pill
    const pill = document.getElementById("connPill");
    const pillText = document.getElementById("connText");
    pill.className = "conn-pill " + (isConn ? "on" : "off");
    pillText.textContent = isConn ? h.host : "offline";

    // Host bar
    let hb = "";
    hosts.forEach((host, i) => {
      const active = i === activeHostIdx ? " active" : "";
      const conn = connected[i] ? " connected" : "";
      hb += '<button class="host-tab'+active+conn+'" data-hi="'+i+'">' +
        '<span class="hdot"></span>' +
        esc(host.label || host.user+"@"+host.host) +
        '</button>';
    });
    hb += '<button class="add-host-tab" id="addHostBtn" title="Add host">+</button>';
    hostBar.innerHTML = hb;

    hostBar.querySelectorAll("[data-hi]").forEach(el => {
      el.addEventListener("click", () => {
        activeHostIdx = parseInt(el.dataset.hi);
        render();
      });
    });
    document.getElementById("addHostBtn").addEventListener("click", openModal);

    // App body
    let html = "";

    if (!isConn) {
      html += '<div class="section">' +
        '<div class="controls">' +
        '<button class="ctrl-btn wide accent" id="connectBtn">' +
        '<span class="icon">⚡</span>' +
        '<span class="labels"><span class="label">Connect to ' + esc(h.label || h.host) + '</span>' +
        '<span class="sub">' + esc(h.user) + '@' + esc(h.host) + '</span></span>' +
        '</button>' +
        '</div></div>';
    } else {
      // Audio section
      html += '<div class="section"><div class="section-label">Audio</div><div class="controls">';
      html += btn("detect", "🔍", "Detect", "sink + format");
      html += btn("volume", "🔊", "Volume", "levels + mute");
      html += btn("info", "🎵", "Engine Info", "full audio report");
      html += '</div></div>';

      // Entrainment section
      html += '<div class="section"><div class="section-label">Entrainment</div><div class="controls">';
      html += btn("render", "🎯", "Render", "focus10 @ native", "accent");
      html += btn("play", "▶️", "Play", "start session", "success-tint");
      html += btn("stop", "⏹️", "Stop", "kill playback");
      html += '</div></div>';

      // System section
      html += '<div class="section"><div class="section-label">System</div><div class="controls">';
      html += btn("uptime", "⏱️", "Uptime", "kernel + uptime");
      html += btn("memory", "📊", "Memory", "RAM usage");
      html += btn("disk", "💾", "Disk", "storage free");
      html += btn("temp", "🌡️", "Temp", "CPU core");
      html += btn("top", "📶", "Top", "by memory");
      html += btnDisconn();
      html += '</div></div>';

      // Output
      html += '<div class="section"><div class="output-card">' +
        '<div class="output-header"><span>Output</span>' +
        '<button class="output-clear" id="clearOutput">Clear</button></div>' +
        '<div class="output-body" id="outputBody">' +
        renderOutput(activeHostIdx) +
        '</div></div></div>';
    }

    // Tip
    if (!tipDismissed) {
      const tip = TIPS[currentTip];
      html += '<div class="tip-banner" id="tipBanner">' +
        '<span class="tip-icon">' + tip.icon + '</span>' +
        '<span class="tip-text">' + tip.html + '</span>' +
        '<button class="dismiss" id="dismissTip" title="Dismiss">×</button>' +
        '</div>';
    }

    html += '<div class="footer-space"></div>';
    app.innerHTML = html;

    // Bind events
    const connectBtnEl = document.getElementById("connectBtn");
    if (connectBtnEl) {
      connectBtnEl.addEventListener("click", () => {
        connected[activeHostIdx] = true;
        render();
      });
    }

    app.querySelectorAll("[data-cmd]").forEach(el => {
      el.addEventListener("click", () => runCmd(el.dataset.cmd));
    });

    const disconnEl = document.getElementById("disconnBtn");
    if (disconnEl) {
      disconnEl.addEventListener("click", () => {
        delete connected[activeHostIdx];
        delete outputs[activeHostIdx];
        render();
      });
    }

    const clearEl = document.getElementById("clearOutput");
    if (clearEl) {
      clearEl.addEventListener("click", () => {
        outputs[activeHostIdx] = [];
        const ob = document.getElementById("outputBody");
        if (ob) ob.innerHTML = "";
      });
    }

    const dismissEl = document.getElementById("dismissTip");
    if (dismissEl) {
      dismissEl.addEventListener("click", () => {
        tipDismissed = true;
        try { localStorage.setItem("pc_tip_dismissed", "1"); } catch(e) {}
        const banner = document.getElementById("tipBanner");
        if (banner) banner.hidden = true;
      });
    }
  }

  function btn(cmd, icon, label, sub, extra) {
    return '<button class="ctrl-btn'+(extra ? ' '+extra : '')+'" data-cmd="'+cmd+'">' +
      '<span class="icon">'+icon+'</span>' +
      '<span class="label">'+esc(label)+'</span>' +
      '<span class="sub">'+esc(sub)+'</span></button>';
  }

  function btnDisconn() {
    return '<button class="ctrl-btn" id="disconnBtn">' +
      '<span class="icon" style="color:var(--error)">⏻</span>' +
      '<span class="label">Disconnect</span>' +
      '<span class="sub">close session</span></button>';
  }

  const LINE_STYLES = {
    "o-cmd": "color:var(--prompt);font-weight:500;margin-top:8px",
    "o-ok": "color:var(--success)",
    "o-warn": "color:var(--warn)",
    "o-val": "color:var(--text-bright);font-weight:500",
  };

  function lineToHtml(l) {
    const s = LINE_STYLES[l.cls] || "";
    return '<div'+(s ? ' style="'+s+'"' : '')+'>'+esc(l.text)+'</div>';
  }

  function runCmd(cmd) {
    const sim = SIMS[cmd];
    if (!sim) return;
    if (!outputs[activeHostIdx]) outputs[activeHostIdx] = [];
    outputs[activeHostIdx].push(...sim);
    const ob = document.getElementById("outputBody");
    if (ob) {
      ob.insertAdjacentHTML("beforeend", sim.map(lineToHtml).join(""));
      ob.scrollTop = ob.scrollHeight;
    }
    const btnEl = app.querySelector('[data-cmd="'+cmd+'"]');
    if (btnEl) {
      btnEl.style.background = "var(--surface-bright)";
      setTimeout(function() { btnEl.style.background = ""; }, 200);
    }
  }

  function renderOutput(idx) {
    var lines = outputs[idx];
    if (!lines || lines.length === 0) return "";
    return lines.map(lineToHtml).join("");
  }

  // ── Modal ──
  const modal = document.getElementById("addModal");
  function openModal() {
    document.getElementById("modalUser").value = "";
    document.getElementById("modalHost").value = "";
    document.getElementById("modalLabel").value = "";
    modal.hidden = false;
    setTimeout(() => document.getElementById("modalUser").focus(), 100);
  }
  document.getElementById("modalCancel").addEventListener("click", () => { modal.hidden = true; });
  document.getElementById("modalConnect").addEventListener("click", () => {
    const user = document.getElementById("modalUser").value.trim() || "user";
    const host = document.getElementById("modalHost").value.trim();
    const label = document.getElementById("modalLabel").value.trim();
    if (!host) return;
    hosts.push({ user, host, label: label || host });
    saveHosts();
    activeHostIdx = hosts.length - 1;
    modal.hidden = true;
    render();
  });
  modal.addEventListener("click", (e) => {
    if (e.target === modal) modal.hidden = true;
  });

  // ── Clock ──
  function tick() {
    document.getElementById("clock").textContent =
      new Date().toLocaleTimeString([], { hour:"2-digit", minute:"2-digit" });
  }
  tick(); setInterval(tick, 30000);

  // ── Init ──
  render();
})();
</script>
