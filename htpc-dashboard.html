<title>Phase Console</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Exo+2:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500&display=swap');

  :root {
    --bg: #0a0a12; --surface: #12121e; --surface-raised: #1a1a2e;
    --border: #252540; --text: #c8c8e0; --text-bright: #eeeef8; --text-dim: #5a5a80;
    --amber: #f0a830; --amber-dim: rgba(240,168,48,0.12); --amber-border: rgba(240,168,48,0.3);
    --lavender: #bb88cc; --lavender-dim: rgba(187,136,204,0.1); --lavender-border: rgba(187,136,204,0.25);
    --blue: #5599cc; --blue-dim: rgba(85,153,204,0.1); --blue-border: rgba(85,153,204,0.25);
    --teal: #44ccaa; --teal-dim: rgba(68,204,170,0.1); --teal-border: rgba(68,204,170,0.2);
    --red: #cc5555; --red-dim: rgba(204,85,85,0.1); --warn: #e8b830;
    --pill-r: 20px;
    color-scheme: dark;
  }
  @media (prefers-color-scheme: light) {
    :root:not([data-theme="dark"]) {
      --bg:#eeeae4;--surface:#faf8f4;--surface-raised:#f0ede6;--border:#d0ccc4;--text:#2c2a26;--text-bright:#141310;--text-dim:#8a8678;--amber:#a06808;--amber-dim:rgba(160,104,8,0.08);--amber-border:rgba(160,104,8,0.2);--lavender:#7a5088;--lavender-dim:rgba(122,80,136,0.06);--lavender-border:rgba(122,80,136,0.15);--blue:#2a6090;--blue-dim:rgba(42,96,144,0.06);--blue-border:rgba(42,96,144,0.15);--teal:#1a8868;--teal-dim:rgba(26,136,104,0.06);--teal-border:rgba(26,136,104,0.12);--red:#b03030;--red-dim:rgba(176,48,48,0.06);--warn:#a08010;
      color-scheme: light;
    }
  }
  :root[data-theme="dark"] { color-scheme: dark; }
  :root[data-theme="light"] {
    --bg:#eeeae4;--surface:#faf8f4;--surface-raised:#f0ede6;--border:#d0ccc4;--text:#2c2a26;--text-bright:#141310;--text-dim:#8a8678;--amber:#a06808;--amber-dim:rgba(160,104,8,0.08);--amber-border:rgba(160,104,8,0.2);--lavender:#7a5088;--lavender-dim:rgba(122,80,136,0.06);--lavender-border:rgba(122,80,136,0.15);--blue:#2a6090;--blue-dim:rgba(42,96,144,0.06);--blue-border:rgba(42,96,144,0.15);--teal:#1a8868;--teal-dim:rgba(26,136,104,0.06);--teal-border:rgba(26,136,104,0.12);--red:#b03030;--red-dim:rgba(176,48,48,0.06);--warn:#a08010;
    color-scheme: light;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    background: var(--bg); color: var(--text);
    font-family: 'Exo 2', system-ui, sans-serif;
    font-size: 14px; line-height: 1.5;
    padding-inline: 16px; padding-block: 0;
    min-height: 100%; display: flex; flex-direction: column;
  }
  html { height: 100%; }

  .header {
    display: flex; align-items: stretch; gap: 0;
    padding: 12px 0 0;
    position: sticky; top: env(safe-area-inset-top, 0px);
    background: var(--bg); z-index: 10;
  }
  .header-accent {
    width: 6px; background: var(--amber);
    border-radius: var(--pill-r) 0 0 var(--pill-r); flex-shrink: 0;
  }
  .header-main {
    flex: 1; display: flex; align-items: center; justify-content: space-between;
    background: var(--surface); border: 1px solid var(--border); border-left: none;
    border-radius: 0 var(--pill-r) var(--pill-r) 0;
    padding: 10px 16px 10px 12px; gap: 8px;
  }
  .wordmark {
    font-weight: 800; font-size: 18px; letter-spacing: 0.06em;
    text-transform: uppercase; color: var(--amber); white-space: nowrap;
  }
  .wordmark-sep { color: var(--lavender); }
  .header-right { display: flex; align-items: center; gap: 8px; font-size: 11px; color: var(--text-dim); }
  .gear-btn {
    background: none; border: 1px solid var(--border); border-radius: 6px;
    width: 30px; height: 30px; display: flex; align-items: center; justify-content: center;
    cursor: pointer; color: var(--text-dim); font-size: 16px; transition: all 0.12s;
  }
  .gear-btn:hover { border-color: var(--lavender-border); color: var(--lavender); }
  .gear-btn.active { background: var(--lavender-dim); border-color: var(--lavender-border); color: var(--lavender); }
  .status-pill {
    display: inline-flex; align-items: center; gap: 5px;
    font-size: 10px; font-weight: 700; letter-spacing: 0.06em;
    text-transform: uppercase; padding: 3px 10px 3px 8px; border-radius: var(--pill-r);
  }
  .status-pill.on { background: var(--teal-dim); color: var(--teal); border: 1px solid var(--teal-border); }
  .status-pill.off { background: var(--red-dim); color: var(--red); border: 1px solid rgba(204,85,85,0.2); }
  .status-dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }

  .host-bar {
    display: flex; gap: 6px; align-items: center;
    padding: 10px 0; overflow-x: auto;
    -webkit-overflow-scrolling: touch; scrollbar-width: none;
  }
  .host-bar::-webkit-scrollbar { display: none; }
  .host-tab {
    display: inline-flex; align-items: center; gap: 6px;
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 0 var(--pill-r) var(--pill-r) 0;
    padding: 8px 14px 8px 10px;
    font-family: inherit; font-size: 13px; font-weight: 600;
    color: var(--text-dim); cursor: pointer; white-space: nowrap;
    transition: all 0.15s; border-left: 3px solid var(--border);
  }
  .host-tab:active { transform: scale(0.97); }
  .host-tab.active { background: var(--amber-dim); border-color: var(--amber-border); border-left-color: var(--amber); color: var(--amber); }
  .host-tab.connected { border-left-color: var(--teal); }
  .host-tab.connected.active { border-left-color: var(--amber); }
  .add-btn {
    display: inline-flex; align-items: center; justify-content: center;
    width: 36px; height: 36px; flex-shrink: 0;
    background: var(--surface); border: 1px dashed var(--border);
    border-radius: var(--pill-r); font-size: 18px; color: var(--text-dim); cursor: pointer;
  }
  .add-btn:active { transform: scale(0.95); }

  .layout { display: flex; flex-direction: column; gap: 10px; flex: 1; padding-bottom: 16px; }
  @media (min-width: 768px) {
    .layout { flex-direction: row; }
    .sidebar { width: 280px; flex-shrink: 0; }
    .main { flex: 1; min-width: 0; }
  }

  .group {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 0 14px 14px 0; overflow: hidden;
    margin-bottom: 8px; border-left: 3px solid var(--border);
  }
  .group.amber { border-left-color: var(--amber); }
  .group.lavender { border-left-color: var(--lavender); }
  .group.blue { border-left-color: var(--blue); }
  .group.teal { border-left-color: var(--teal); }
  .group-head {
    display: flex; align-items: center; justify-content: space-between;
    padding: 8px 12px;
    font-size: 10px; font-weight: 700; letter-spacing: 0.1em;
    text-transform: uppercase; color: var(--text-dim);
  }

  .cmd-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; padding: 0 8px 8px; }
  @media (min-width: 768px) { .cmd-grid { grid-template-columns: 1fr 1fr 1fr; } }
  .cmd-btn {
    display: flex; align-items: center; gap: 8px;
    background: var(--surface-raised); border: 1px solid var(--border);
    border-radius: 0 10px 10px 0; border-left: 2px solid var(--border);
    padding: 10px 10px 10px 8px; cursor: pointer; transition: all 0.12s;
    font-family: inherit; color: var(--text);
  }
  .cmd-btn:active { transform: scale(0.97); background: var(--border); }
  .cmd-btn:focus-visible { outline: 2px solid var(--blue); outline-offset: 1px; }
  .cmd-key {
    display: inline-flex; align-items: center; justify-content: center;
    min-width: 22px; height: 22px; border-radius: 4px;
    background: var(--bg); border: 1px solid var(--border);
    font-size: 10px; font-weight: 700; color: var(--text-dim);
    font-family: 'IBM Plex Mono', monospace; flex-shrink: 0;
  }
  .cmd-lbl { display: flex; flex-direction: column; min-width: 0; }
  .cmd-name {
    font-size: 12px; font-weight: 600; color: var(--text-bright);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .cmd-desc {
    font-size: 10px; color: var(--text-dim);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .cmd-btn.accent { border-left-color: var(--amber); }
  .cmd-btn.accent .cmd-key { border-color: var(--amber-border); color: var(--amber); }
  .cmd-btn.play { border-left-color: var(--teal); }
  .cmd-btn.play .cmd-key { border-color: var(--teal-border); color: var(--teal); }

  .connect-card {
    display: flex; align-items: center; gap: 12px;
    background: var(--amber-dim); border: 1px solid var(--amber-border);
    border-radius: 0 14px 14px 0; border-left: 3px solid var(--amber);
    padding: 16px; cursor: pointer; transition: all 0.12s; margin-bottom: 8px;
  }
  .connect-card:active { transform: scale(0.98); }

  .output-panel {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 0 14px 14px 0; border-left: 3px solid var(--blue);
    overflow: hidden; display: flex; flex-direction: column;
  }
  @media (min-width: 768px) { .output-panel { flex: 1; min-height: 200px; } }
  .output-head {
    display: flex; align-items: center; justify-content: space-between;
    padding: 8px 12px;
    font-size: 10px; font-weight: 700; letter-spacing: 0.1em;
    text-transform: uppercase; color: var(--text-dim);
    border-bottom: 1px solid var(--border);
  }
  .output-head button {
    background: none; border: none; font-family: inherit;
    font-size: 10px; color: var(--text-dim); cursor: pointer; padding: 2px 6px;
  }
  .output-head button:hover { color: var(--text); }
  .out-body {
    padding: 8px 12px; max-height: 220px; overflow-y: auto;
    font-family: 'IBM Plex Mono', monospace; font-size: 11.5px;
    line-height: 1.55; -webkit-user-select: text; user-select: text;
  }
  @media (min-width: 768px) { .out-body { max-height: none; flex: 1; } }
  .out-body:empty::after {
    content: "Run a command to see output"; color: var(--text-dim); font-style: italic;
  }

  .kb-help {
    display: none; background: var(--surface); border: 1px solid var(--border);
    border-radius: 0 14px 14px 0; border-left: 3px solid var(--lavender);
    padding: 10px 12px; font-size: 11px; color: var(--text-dim); line-height: 1.6;
  }
  @media (min-width: 768px) { .kb-help { display: block; } }
  .kb-help kbd {
    display: inline-flex; align-items: center; justify-content: center;
    min-width: 18px; height: 18px; padding: 0 4px;
    background: var(--bg); border: 1px solid var(--border); border-radius: 3px;
    font-family: 'IBM Plex Mono', monospace; font-size: 10px; font-weight: 700; color: var(--lavender);
  }

  .tip {
    display: flex; align-items: flex-start; gap: 10px;
    background: var(--lavender-dim); border: 1px solid var(--lavender-border);
    border-radius: 0 14px 14px 0; border-left: 3px solid var(--lavender);
    padding: 10px 12px; font-size: 12px; color: var(--text); margin-bottom: 8px;
  }

  /* ── Settings view ── */
  .settings-section {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 0 14px 14px 0; border-left: 3px solid var(--border);
    margin-bottom: 10px; overflow: hidden;
  }
  .settings-section.amber { border-left-color: var(--amber); }
  .settings-section.lavender { border-left-color: var(--lavender); }
  .settings-section.blue { border-left-color: var(--blue); }
  .settings-section.teal { border-left-color: var(--teal); }
  .ss-head {
    padding: 10px 14px; font-size: 10px; font-weight: 700;
    letter-spacing: 0.1em; text-transform: uppercase; color: var(--text-dim);
    border-bottom: 1px solid var(--border);
  }
  .ss-body { padding: 10px 14px; }
  .host-row {
    display: flex; align-items: center; gap: 10px;
    padding: 8px 0; border-bottom: 1px solid var(--border);
  }
  .host-row:last-child { border-bottom: none; }
  .host-info { flex: 1; min-width: 0; }
  .host-label {
    font-size: 13px; font-weight: 600; color: var(--text-bright);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .host-addr {
    font-size: 11px; color: var(--text-dim);
    font-family: 'IBM Plex Mono', monospace;
  }
  .host-actions { display: flex; gap: 4px; flex-shrink: 0; }
  .icon-btn {
    background: var(--surface-raised); border: 1px solid var(--border);
    border-radius: 6px; width: 30px; height: 30px;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; color: var(--text-dim); font-size: 13px; transition: all 0.12s;
  }
  .icon-btn:hover { color: var(--text); border-color: var(--text-dim); }
  .icon-btn.danger:hover { color: var(--red); border-color: var(--red); }
  .setting-row {
    display: flex; align-items: center; justify-content: space-between;
    padding: 8px 0; gap: 12px;
  }
  .setting-row + .setting-row { border-top: 1px solid var(--border); }
  .setting-label { font-size: 12px; font-weight: 600; color: var(--text-bright); }
  .setting-hint { font-size: 10px; color: var(--text-dim); margin-top: 2px; }
  .seg-control {
    display: inline-flex; background: var(--bg); border: 1px solid var(--border);
    border-radius: 8px; overflow: hidden; flex-shrink: 0;
  }
  .seg-btn {
    background: none; border: none; padding: 6px 12px;
    font-family: inherit; font-size: 11px; font-weight: 600;
    color: var(--text-dim); cursor: pointer; transition: all 0.12s;
  }
  .seg-btn.active { background: var(--lavender-dim); color: var(--lavender); }
  .seg-btn + .seg-btn { border-left: 1px solid var(--border); }
  .shortcut-grid {
    display: grid; grid-template-columns: auto 1fr;
    gap: 4px 12px; align-items: center; font-size: 12px;
  }
  .shortcut-grid kbd {
    display: inline-flex; align-items: center; justify-content: center;
    min-width: 24px; height: 22px; padding: 0 6px;
    background: var(--bg); border: 1px solid var(--border); border-radius: 4px;
    font-family: 'IBM Plex Mono', monospace; font-size: 10px; font-weight: 700;
    color: var(--lavender);
  }
  .add-host-btn {
    display: flex; align-items: center; justify-content: center; gap: 6px;
    width: 100%; padding: 10px; margin-top: 6px;
    background: var(--amber-dim); border: 1px dashed var(--amber-border);
    border-radius: 0 10px 10px 0; border-left: 2px solid var(--amber);
    cursor: pointer; font-family: inherit; font-size: 12px;
    font-weight: 700; color: var(--amber); transition: all 0.12s;
  }
  .add-host-btn:active { transform: scale(0.98); }

  .modal-bg {
    position: fixed; inset: 0; background: rgba(0,0,0,0.6);
    z-index: 100; display: flex; align-items: flex-end; justify-content: center; padding: 16px;
  }
  .modal-bg[hidden] { display: none; }
  @media (min-width: 768px) { .modal-bg { align-items: center; } }
  .modal-box {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 20px 20px 14px 14px; width: 100%; max-width: 400px;
    padding: 20px; border-top: 3px solid var(--amber);
  }
  @media (min-width: 768px) { .modal-box { border-radius: 14px; border-top: 3px solid var(--amber); } }
  .modal-title { font-size: 16px; font-weight: 700; color: var(--text-bright); margin: 0 0 4px; }
  .modal-sub { font-size: 12px; color: var(--text-dim); margin: 0 0 14px; }
  .mf { display: flex; flex-direction: column; gap: 5px; margin-bottom: 10px; }
  .mf label {
    font-size: 10px; font-weight: 700; letter-spacing: 0.06em;
    text-transform: uppercase; color: var(--text-dim);
  }
  .mf input, .mf select {
    background: var(--bg); border: 1px solid var(--border); border-radius: 8px;
    padding: 10px 12px; font-family: inherit; font-size: 14px;
    color: var(--text); outline: none;
  }
  .mf input:focus, .mf select:focus { border-color: var(--amber-border); }
  .mf input::placeholder { color: var(--text-dim); }
  .m-actions { display: flex; gap: 8px; margin-top: 14px; }
  .m-actions button {
    flex: 1; padding: 11px; font-family: inherit; font-size: 13px;
    font-weight: 700; cursor: pointer; border: none; letter-spacing: 0.02em;
  }
  .m-cancel { background: var(--surface-raised); color: var(--text); border-radius: 10px 0 0 10px; }
  .m-ok { background: var(--amber); color: var(--bg); border-radius: 0 10px 10px 0; }
  .m-actions button:active { transform: scale(0.98); }
  .m-delete {
    background: var(--red-dim); color: var(--red); border-radius: 10px;
    border: 1px solid rgba(204,85,85,0.2);
  }

  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<div class="header">
  <div class="header-accent"></div>
  <div class="header-main">
    <div class="wordmark">Phase<span class="wordmark-sep"> / </span>Console</div>
    <div class="header-right">
      <span id="clock">--:--</span>
      <div class="status-pill off" id="sPill"><span class="status-dot"></span><span id="sText">offline</span></div>
      <button class="gear-btn" id="gearBtn" title="Settings">&#9881;</button>
    </div>
  </div>
</div>

<div id="hostBar" class="host-bar"></div>
<div id="layout" class="layout"></div>

<div class="modal-bg" id="modal" hidden></div>

<script>
(function () {
  "use strict";

  var VIEW_CONSOLE = 0, VIEW_SETTINGS = 1;
  var hosts, activeIdx, connectedSet, outputLog, tipDismissed, currentView, prefs;

  function loadStore(k, fallback) {
    try { var v = localStorage.getItem(k); return v !== null ? JSON.parse(v) : fallback; }
    catch (e) { return fallback; }
  }
  function saveStore(k, v) {
    try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { /* storage unavailable */ }
  }

  function init() {
    hosts = loadStore("pc_hosts", [{ user: "htpc", host: "htpc", label: "HTPC" }]);
    activeIdx = 0;
    connectedSet = {};
    outputLog = {};
    tipDismissed = loadStore("pc_tip_off", false);
    currentView = VIEW_CONSOLE;
    prefs = loadStore("pc_prefs", { theme: "system", protocol: "focus10", bitDepth: 32, sampleRate: 48000 });
  }

  function applyTheme(choice) {
    if (choice === "dark") {
      document.documentElement.setAttribute("data-theme", "dark");
    } else if (choice === "light") {
      document.documentElement.setAttribute("data-theme", "light");
    } else {
      document.documentElement.removeAttribute("data-theme");
    }
  }

  var CMDS = [
    { id: "detect", key: "1", name: "Detect",  desc: "sink + format",  group: "audio" },
    { id: "volume", key: "2", name: "Volume",  desc: "levels + mute",  group: "audio" },
    { id: "info",   key: "3", name: "Engine",  desc: "audio report",   group: "audio" },
    { id: "render", key: "4", name: "Render",  desc: "focus10 native", group: "entrainment", accent: "accent" },
    { id: "play",   key: "5", name: "Play",    desc: "start session",  group: "entrainment", accent: "play" },
    { id: "stop",   key: "6", name: "Stop",    desc: "kill playback",  group: "entrainment" },
    { id: "uptime", key: "7", name: "Uptime",  desc: "kernel info",    group: "system" },
    { id: "memory", key: "8", name: "Memory",  desc: "RAM usage",      group: "system" },
    { id: "disk",   key: "9", name: "Disk",    desc: "storage free",   group: "system" },
    { id: "temp",   key: "0", name: "Temp",    desc: "CPU core",       group: "system" },
    { id: "top",    key: "T", name: "Top",     desc: "by memory",      group: "system" }
  ];

  var SIMS = {
    detect: [
      { c: 1, t: "$ pactl info | grep -E 'Server|Default Sink'" },
      { c: 0, t: "Server Name: PipeWire (version 1.0)" },
      { c: 2, t: "Default Sink: alsa_output.pci-0000_00_1f.3.hdmi-stereo" },
      { c: 1, t: "$ pactl list sinks short" },
      { c: 2, t: "60  hdmi-stereo  PipeWire  s32le 2ch 48000Hz  RUNNING" }
    ],
    volume: [
      { c: 1, t: "$ pactl get-sink-volume @DEFAULT_SINK@" },
      { c: 2, t: "Volume: L 40% / R 40%  (-23.88 dB)" },
      { c: 1, t: "$ pactl get-sink-mute @DEFAULT_SINK@" },
      { c: 3, t: "Mute: no" }
    ],
    info: [
      { c: 1, t: "$ python3 -m vibroacoustic_entrainment.cli --show-audio-info" },
      { c: 0, t: "System audio output:" },
      { c: 2, t: "  Sink: hdmi-stereo (PipeWire)  Rate: 48000 Hz" },
      { c: 2, t: "  Format: s32le (32-bit)  Ch: 2  Vol: 40%" }
    ],
    render: [
      { c: 1, t: "$ python3 -m vibroacoustic_entrainment.cli --match-system --protocol focus10" },
      { c: 3, t: "  -> Using: 48000 Hz, 32-bit" },
      { c: 2, t: "Rendered 'gateway_focus10' (1800s)" },
      { c: 0, t: "  audio.wav  haptic.wav  photic_events.json" }
    ],
    play:   [{ c: 1, t: "$ paplay ~/entrainment_out/audio.wav &" }, { c: 3, t: "▶ Playing gateway_focus10 — 30:00" }],
    stop:   [{ c: 1, t: "$ pkill paplay" }, { c: 4, t: "■ Stopped playback" }],
    uptime: [{ c: 1, t: "$ uptime -p && uname -r" }, { c: 2, t: "up 14 days, 7:23" }, { c: 0, t: "6.18.44-fc-v37" }],
    memory: [{ c: 1, t: "$ free -h | head -2" }, { c: 0, t: "              total    used     free     avail" }, { c: 2, t: "Mem:          16Gi     6.2Gi    4.1Gi    9.2Gi" }],
    disk:   [{ c: 1, t: "$ df -h / /home | tail -2" }, { c: 2, t: "/   468G  142G  302G  32%" }, { c: 2, t: "/home  931G  89G  798G  10%" }],
    temp:   [{ c: 1, t: "$ sensors | grep 'Core 0'" }, { c: 3, t: "Core 0: +42.0°C  (high +100°C)" }],
    top:    [{ c: 1, t: "$ ps aux --sort=-%mem | head -4" }, { c: 4, t: "htpc 1842 2.1% 8.4% /usr/bin/kodi" }, { c: 0, t: "htpc 2103 0.8% 3.2% pipewire" }, { c: 0, t: "htpc 1201 0.3% 1.8% Xwayland" }]
  };

  var LINE_STYLES = [
    "",
    "color:var(--amber)",
    "color:var(--text-bright);font-weight:500",
    "color:var(--teal)",
    "color:var(--warn)"
  ];

  // ── DOM helpers ──
  function el(tag, attrs, children) {
    var node = document.createElement(tag);
    if (attrs) {
      Object.keys(attrs).forEach(function (k) {
        if (k === "className") { node.className = attrs[k]; }
        else if (k === "textContent") { node.textContent = attrs[k]; }
        else if (k === "style") { node.style.cssText = attrs[k]; }
        else if (k.slice(0, 2) === "on") { node.addEventListener(k.slice(2), attrs[k]); }
        else if (k === "dataset") {
          Object.keys(attrs[k]).forEach(function (dk) { node.dataset[dk] = attrs[k][dk]; });
        }
        else { node.setAttribute(k, attrs[k]); }
      });
    }
    if (children) {
      (Array.isArray(children) ? children : [children]).forEach(function (c) {
        if (c != null) { node.appendChild(typeof c === "string" ? document.createTextNode(c) : c); }
      });
    }
    return node;
  }

  function clearEl(node) { while (node.firstChild) { node.removeChild(node.firstChild); } }

  function makeLine(line) {
    var div = document.createElement("div");
    var s = LINE_STYLES[line.c];
    if (s) { div.style.cssText = s; }
    div.textContent = line.t;
    return div;
  }

  // ── References ──
  var layoutEl = document.getElementById("layout");
  var hostBarEl = document.getElementById("hostBar");
  var modalEl = document.getElementById("modal");
  var gearBtn = document.getElementById("gearBtn");

  // ── Render orchestrator ──
  function render() {
    var h = hosts[activeIdx];
    var isConn = !!connectedSet[activeIdx];

    document.getElementById("sPill").className = "status-pill " + (isConn ? "on" : "off");
    document.getElementById("sText").textContent = isConn ? h.host : "offline";
    gearBtn.className = "gear-btn" + (currentView === VIEW_SETTINGS ? " active" : "");

    if (currentView === VIEW_SETTINGS) {
      hostBarEl.hidden = true;
      renderSettings();
    } else {
      hostBarEl.hidden = false;
      renderHostBar();
      renderConsole(h, isConn);
    }
  }

  // ── Host bar (DOM only) ──
  function renderHostBar() {
    var frag = document.createDocumentFragment();
    hosts.forEach(function (h, i) {
      var cls = "host-tab";
      if (i === activeIdx) { cls += " active"; }
      if (connectedSet[i]) { cls += " connected"; }
      frag.appendChild(el("button", {
        className: cls,
        textContent: h.label || (h.user + "@" + h.host),
        onclick: function () { activeIdx = i; render(); }
      }));
    });
    frag.appendChild(el("button", {
      className: "add-btn", textContent: "+", title: "Add host",
      onclick: function () { openHostModal(); }
    }));
    clearEl(hostBarEl);
    hostBarEl.appendChild(frag);
  }

  // ── Console view (DOM only) ──
  function renderConsole(h, isConn) {
    var frag = document.createDocumentFragment();

    if (!isConn) {
      var card = el("div", { className: "connect-card", onclick: function () { connectedSet[activeIdx] = true; render(); } }, [
        el("span", { style: "font-size:22px" }, "⚡"),
        el("div", null, [
          el("div", { style: "font-size:14px;font-weight:700;color:var(--amber)" }, "Connect to " + (h.label || h.host)),
          el("div", { style: "font-size:11px;color:var(--text-dim)" }, h.user + "@" + h.host + " — press Enter or tap")
        ])
      ]);
      frag.appendChild(card);

      if (!tipDismissed) {
        var tipEl = el("div", { className: "tip" }, [
          el("span", null, "💡"),
          el("span", null, [
            el("strong", { style: "color:var(--text-bright);font-weight:600" }, "Quick start: "),
            document.createTextNode("Connect → Detect → Render → Play. Use number keys with a Bluetooth keyboard for hands-free control.")
          ]),
          el("button", {
            style: "background:none;border:none;color:var(--text-dim);font-size:16px;cursor:pointer;margin-left:auto;padding:0;line-height:1",
            onclick: function () { tipDismissed = true; saveStore("pc_tip_off", true); tipEl.hidden = true; }
          }, "×")
        ]);
        frag.appendChild(tipEl);
      }
    } else {
      var sidebar = el("div", { className: "sidebar" });
      sidebar.appendChild(buildGroup("Audio", "amber", CMDS.filter(function (c) { return c.group === "audio"; })));
      sidebar.appendChild(buildGroup("Entrainment", "teal", CMDS.filter(function (c) { return c.group === "entrainment"; })));
      sidebar.appendChild(buildGroup("System", "lavender", CMDS.filter(function (c) { return c.group === "system"; })));

      var disconnGrp = el("div", { className: "group blue", style: "padding:8px 12px" });
      var disconnBtn = el("button", {
        className: "cmd-btn", style: "width:100%;border-left-color:var(--red)",
        onclick: function () { delete connectedSet[activeIdx]; delete outputLog[activeIdx]; render(); }
      }, [
        el("span", { className: "cmd-key", style: "color:var(--red);border-color:rgba(204,85,85,0.3)" }, "Esc"),
        el("span", { className: "cmd-lbl" }, [
          el("span", { className: "cmd-name" }, "Disconnect"),
          el("span", { className: "cmd-desc" }, "close session")
        ])
      ]);
      disconnGrp.appendChild(disconnBtn);
      sidebar.appendChild(disconnGrp);
      frag.appendChild(sidebar);

      var main = el("div", { className: "main" });
      var outPanel = el("div", { className: "output-panel" });
      var outHead = el("div", { className: "output-head" }, [
        el("span", null, "Output"),
        el("button", { onclick: function () { outputLog[activeIdx] = []; var ob = document.getElementById("outBody"); if (ob) { clearEl(ob); } } }, "Clear")
      ]);
      outPanel.appendChild(outHead);

      var outBody = el("div", { className: "out-body", id: "outBody" });
      var lines = outputLog[activeIdx];
      if (lines) { lines.forEach(function (l) { outBody.appendChild(makeLine(l)); }); }
      outPanel.appendChild(outBody);
      main.appendChild(outPanel);

      var kbHelp = el("div", { className: "kb-help", style: "margin-top:8px" }, [
        el("strong", { style: "color:var(--lavender)" }, "Keyboard"),
        document.createTextNode(" — Numbers "),
        el("kbd", null, "1"), document.createTextNode("-"), el("kbd", null, "0"),
        document.createTextNode(" run commands, "),
        el("kbd", null, "T"), document.createTextNode(" top, "),
        el("kbd", null, "Esc"), document.createTextNode(" disconnect, "),
        el("kbd", null, "Space"), document.createTextNode(" play/pause, "),
        el("kbd", null, "S"), document.createTextNode(" settings")
      ]);
      main.appendChild(kbHelp);
      frag.appendChild(main);
    }

    clearEl(layoutEl);
    layoutEl.appendChild(frag);
  }

  function buildGroup(title, color, cmds) {
    var grp = el("div", { className: "group " + color });
    grp.appendChild(el("div", { className: "group-head", textContent: title }));
    var grid = el("div", { className: "cmd-grid" });
    cmds.forEach(function (c) {
      var btn = el("button", {
        className: "cmd-btn" + (c.accent ? " " + c.accent : ""),
        onclick: function () { runCmd(c.id); }
      }, [
        el("span", { className: "cmd-key" }, c.key),
        el("span", { className: "cmd-lbl" }, [
          el("span", { className: "cmd-name" }, c.name),
          el("span", { className: "cmd-desc" }, c.desc)
        ])
      ]);
      grid.appendChild(btn);
    });
    grp.appendChild(grid);
    return grp;
  }

  // ── Settings view (DOM only) ──
  function renderSettings() {
    var frag = document.createDocumentFragment();

    frag.appendChild(buildRemotesSection());
    frag.appendChild(buildAudioSection());
    frag.appendChild(buildDisplaySection());
    frag.appendChild(buildShortcutsSection());

    clearEl(layoutEl);
    layoutEl.appendChild(frag);
  }

  function buildRemotesSection() {
    var sec = el("div", { className: "settings-section amber" });
    sec.appendChild(el("div", { className: "ss-head" }, "Remotes"));
    var body = el("div", { className: "ss-body" });

    hosts.forEach(function (h, i) {
      var row = el("div", { className: "host-row" }, [
        el("div", { className: "host-info" }, [
          el("div", { className: "host-label" }, h.label || h.host),
          el("div", { className: "host-addr" }, h.user + "@" + h.host)
        ]),
        el("div", { className: "host-actions" }, [
          el("button", {
            className: "icon-btn", title: "Edit",
            onclick: function () { openHostModal(i); }
          }, "✎"),
          el("button", {
            className: "icon-btn danger", title: "Remove",
            onclick: function () {
              if (hosts.length <= 1) { return; }
              openConfirmModal("Remove " + (h.label || h.host) + "?",
                "This will delete the saved remote. You can re-add it later.", function () {
                  hosts.splice(i, 1);
                  saveStore("pc_hosts", hosts);
                  if (activeIdx >= hosts.length) { activeIdx = hosts.length - 1; }
                  delete connectedSet[i]; delete outputLog[i];
                  render();
                });
            }
          }, "✕")
        ])
      ]);
      body.appendChild(row);
    });

    body.appendChild(el("button", {
      className: "add-host-btn",
      onclick: function () { openHostModal(); }
    }, [document.createTextNode("+ Add Remote")]));

    sec.appendChild(body);
    return sec;
  }

  function buildAudioSection() {
    var sec = el("div", { className: "settings-section teal" });
    sec.appendChild(el("div", { className: "ss-head" }, "Audio Output"));
    var body = el("div", { className: "ss-body" });

    body.appendChild(settingRow("Default Protocol", "Entrainment session to render",
      makeSegControl(["focus10", "focus12", "obe_phase"], prefs.protocol, function (v) {
        prefs.protocol = v; saveStore("pc_prefs", prefs);
      })
    ));
    body.appendChild(settingRow("Bit Depth", "Match your DAC output format",
      makeSegControl(["16", "32"], String(prefs.bitDepth), function (v) {
        prefs.bitDepth = parseInt(v, 10); saveStore("pc_prefs", prefs);
      })
    ));
    body.appendChild(settingRow("Sample Rate", "Match your audio sink",
      makeSegControl(["44100", "48000", "96000"], String(prefs.sampleRate), function (v) {
        prefs.sampleRate = parseInt(v, 10); saveStore("pc_prefs", prefs);
      })
    ));

    sec.appendChild(body);
    return sec;
  }

  function buildDisplaySection() {
    var sec = el("div", { className: "settings-section lavender" });
    sec.appendChild(el("div", { className: "ss-head" }, "Display"));
    var body = el("div", { className: "ss-body" });

    body.appendChild(settingRow("Theme", "System follows your OS preference",
      makeSegControl(["system", "dark", "light"], prefs.theme, function (v) {
        prefs.theme = v; saveStore("pc_prefs", prefs); applyTheme(v);
        render();
      })
    ));

    sec.appendChild(body);
    return sec;
  }

  function buildShortcutsSection() {
    var sec = el("div", { className: "settings-section blue" });
    sec.appendChild(el("div", { className: "ss-head" }, "Keyboard Shortcuts"));
    var body = el("div", { className: "ss-body" });
    var grid = el("div", { className: "shortcut-grid" });

    var shortcuts = [
      ["1-0", "Run commands (when connected)"],
      ["T", "Top processes"],
      ["Space", "Toggle play / pause"],
      ["Enter", "Connect to active host"],
      ["Esc", "Disconnect session"],
      ["S", "Toggle settings"]
    ];
    shortcuts.forEach(function (pair) {
      grid.appendChild(el("kbd", null, pair[0]));
      grid.appendChild(el("span", { style: "color:var(--text)" }, pair[1]));
    });

    body.appendChild(grid);
    body.appendChild(el("div", {
      style: "margin-top:10px;font-size:11px;color:var(--text-dim);line-height:1.5"
    }, "Works with any USB, Bluetooth, or wireless keyboard. Pair your remote via your HTPC’s Bluetooth settings, then use these shortcuts from across the room."));
    sec.appendChild(body);
    return sec;
  }

  function settingRow(label, hint, control) {
    return el("div", { className: "setting-row" }, [
      el("div", null, [
        el("div", { className: "setting-label" }, label),
        el("div", { className: "setting-hint" }, hint)
      ]),
      control
    ]);
  }

  function makeSegControl(options, active, onChange) {
    var wrap = el("div", { className: "seg-control" });
    options.forEach(function (opt) {
      wrap.appendChild(el("button", {
        className: "seg-btn" + (opt === active ? " active" : ""),
        textContent: opt,
        onclick: function () {
          onChange(opt);
          wrap.querySelectorAll(".seg-btn").forEach(function (b) {
            b.className = "seg-btn" + (b.textContent === opt ? " active" : "");
          });
        }
      }));
    });
    return wrap;
  }

  // ── Commands ──
  function runCmd(id) {
    var sim = SIMS[id];
    if (!sim) { return; }
    if (!outputLog[activeIdx]) { outputLog[activeIdx] = []; }
    outputLog[activeIdx] = outputLog[activeIdx].concat(sim);
    var ob = document.getElementById("outBody");
    if (ob) {
      sim.forEach(function (l) { ob.appendChild(makeLine(l)); });
      ob.scrollTop = ob.scrollHeight;
    }
  }

  // ── Keyboard (BT / USB / built-in) ──
  var KEY_MAP = { "1": "detect", "2": "volume", "3": "info", "4": "render", "5": "play", "6": "stop", "7": "uptime", "8": "memory", "9": "disk", "0": "temp" };

  document.addEventListener("keydown", function (e) {
    var tag = e.target.tagName;
    if (tag === "INPUT" || tag === "TEXTAREA" || tag === "SELECT") { return; }
    if (!modalEl.hidden) {
      if (e.key === "Escape") { modalEl.hidden = true; e.preventDefault(); }
      return;
    }
    if (e.key === "s" || e.key === "S") {
      if (currentView === VIEW_SETTINGS && e.key === "S") { /* ignore shift+S for capital S in settings */ }
      currentView = currentView === VIEW_SETTINGS ? VIEW_CONSOLE : VIEW_SETTINGS;
      render(); e.preventDefault(); return;
    }
    if (currentView === VIEW_SETTINGS) { return; }
    var isConn = !!connectedSet[activeIdx];
    if (e.key === "Enter" && !isConn) { connectedSet[activeIdx] = true; render(); e.preventDefault(); return; }
    if (e.key === "Escape" && isConn) { delete connectedSet[activeIdx]; delete outputLog[activeIdx]; render(); e.preventDefault(); return; }
    if (!isConn) { return; }
    if (KEY_MAP[e.key]) { runCmd(KEY_MAP[e.key]); e.preventDefault(); return; }
    if (e.key === "t" || e.key === "T") { runCmd("top"); e.preventDefault(); return; }
    if (e.key === " ") {
      var playing = (outputLog[activeIdx] || []).some(function (l) { return l.t.indexOf("▶") >= 0; });
      runCmd(playing ? "stop" : "play");
      e.preventDefault();
    }
  });

  // ── Gear button ──
  gearBtn.addEventListener("click", function () {
    currentView = currentView === VIEW_SETTINGS ? VIEW_CONSOLE : VIEW_SETTINGS;
    render();
  });

  // ── Modals (DOM only) ──
  function openHostModal(editIdx) {
    var isEdit = editIdx !== undefined;
    var existing = isEdit ? hosts[editIdx] : null;

    clearEl(modalEl);
    var box = el("div", { className: "modal-box" });
    box.appendChild(el("h3", { className: "modal-title" }, isEdit ? "Edit Remote" : "Add Remote"));
    box.appendChild(el("p", { className: "modal-sub" }, "SSH connection for your HTPC or network device."));

    var userInput = el("input", { type: "text", placeholder: "htpc", autocomplete: "off", autocapitalize: "off", spellcheck: "false" });
    if (existing) { userInput.value = existing.user; }
    var hostInput = el("input", { type: "text", placeholder: "192.168.1.100", autocomplete: "off", autocapitalize: "off", spellcheck: "false" });
    if (existing) { hostInput.value = existing.host; }
    var labelInput = el("input", { type: "text", placeholder: "Living room HTPC", autocomplete: "off", spellcheck: "false" });
    if (existing) { labelInput.value = existing.label; }

    box.appendChild(el("div", { className: "mf" }, [el("label", null, "User"), userInput]));
    box.appendChild(el("div", { className: "mf" }, [el("label", null, "Hostname / IP"), hostInput]));
    box.appendChild(el("div", { className: "mf" }, [el("label", null, "Label"), labelInput]));

    var actions = el("div", { className: "m-actions" });
    actions.appendChild(el("button", {
      className: "m-cancel",
      onclick: function () { modalEl.hidden = true; }
    }, "Cancel"));

    if (isEdit) {
      actions.appendChild(el("button", {
        className: "m-ok",
        onclick: function () {
          var u = userInput.value.trim() || "user";
          var h = hostInput.value.trim();
          if (!h) { return; }
          hosts[editIdx] = { user: u, host: h, label: labelInput.value.trim() || h };
          saveStore("pc_hosts", hosts);
          modalEl.hidden = true;
          render();
        }
      }, "Save"));
    } else {
      actions.appendChild(el("button", {
        className: "m-ok",
        onclick: function () {
          var u = userInput.value.trim() || "user";
          var h = hostInput.value.trim();
          if (!h) { return; }
          hosts.push({ user: u, host: h, label: labelInput.value.trim() || h });
          saveStore("pc_hosts", hosts);
          activeIdx = hosts.length - 1;
          modalEl.hidden = true;
          currentView = VIEW_CONSOLE;
          render();
        }
      }, "Add"));
    }

    box.appendChild(actions);
    modalEl.appendChild(box);
    modalEl.hidden = false;
    setTimeout(function () { userInput.focus(); }, 80);
  }

  function openConfirmModal(title, message, onConfirm) {
    clearEl(modalEl);
    var box = el("div", { className: "modal-box" });
    box.appendChild(el("h3", { className: "modal-title" }, title));
    box.appendChild(el("p", { className: "modal-sub" }, message));
    var actions = el("div", { className: "m-actions" });
    actions.appendChild(el("button", {
      className: "m-cancel",
      onclick: function () { modalEl.hidden = true; }
    }, "Cancel"));
    actions.appendChild(el("button", {
      className: "m-delete",
      onclick: function () { modalEl.hidden = true; onConfirm(); }
    }, "Remove"));
    box.appendChild(actions);
    modalEl.appendChild(box);
    modalEl.hidden = false;
  }

  modalEl.addEventListener("click", function (e) { if (e.target === modalEl) { modalEl.hidden = true; } });

  // ── Clock ──
  function tick() {
    var c = document.getElementById("clock");
    if (c) { c.textContent = new Date().toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" }); }
  }
  tick();
  setInterval(tick, 30000);

  // ── Boot ──
  init();
  applyTheme(prefs.theme);
  render();
})();
</script>
