<title>Phase Console</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap');

  :root {
    --bg: #090c11;
    --panel: #111620;
    --panel-raised: #161d2a;
    --border: #1e2736;
    --border-focus: #2a3548;
    --border-active: #3a4a60;
    --text: #c8cdd6;
    --text-bright: #e8ecf2;
    --dim: #4a5568;
    --prompt: #e8a840;
    --prompt-dim: #b07520;
    --success: #4ade80;
    --success-dim: #166534;
    --warn: #fbbf24;
    --error: #f87171;
    --info: #60a5fa;
    --btn-bg: #161d2a;
    --btn-bg-hover: #1e2736;
    --input-bg: #0d1018;
    --dot-close: #ff5f57;
    --dot-minimize: #febc2e;
    --dot-maximize: #28c840;
    color-scheme: dark;
  }
  @media (prefers-color-scheme: light) {
    :root:not([data-theme="dark"]) {
      --bg: #f0ede6;
      --panel: #ffffff;
      --panel-raised: #f7f5f0;
      --border: #d4cfc4;
      --border-focus: #bbb5a8;
      --border-active: #9a9488;
      --text: #2d2a24;
      --text-bright: #1a1815;
      --dim: #8a8478;
      --prompt: #9e6a10;
      --prompt-dim: #c48a20;
      --success: #16a34a;
      --success-dim: #bbf7d0;
      --warn: #ca8a04;
      --error: #dc2626;
      --info: #2563eb;
      --btn-bg: #f0ede6;
      --btn-bg-hover: #e6e2d8;
      --input-bg: #faf9f6;
      --dot-close: #e84040;
      --dot-minimize: #dba020;
      --dot-maximize: #1fa835;
      color-scheme: light;
    }
  }
  :root[data-theme="dark"] {
    --bg: #090c11;
    --panel: #111620;
    --panel-raised: #161d2a;
    --border: #1e2736;
    --border-focus: #2a3548;
    --border-active: #3a4a60;
    --text: #c8cdd6;
    --text-bright: #e8ecf2;
    --dim: #4a5568;
    --prompt: #e8a840;
    --btn-bg: #161d2a;
    --btn-bg-hover: #1e2736;
    --input-bg: #0d1018;
    color-scheme: dark;
  }
  :root[data-theme="light"] {
    --bg: #f0ede6;
    --panel: #ffffff;
    --panel-raised: #f7f5f0;
    --border: #d4cfc4;
    --border-focus: #bbb5a8;
    --border-active: #9a9488;
    --text: #2d2a24;
    --text-bright: #1a1815;
    --dim: #8a8478;
    --prompt: #9e6a10;
    --prompt-dim: #c48a20;
    --success: #16a34a;
    --success-dim: #bbf7d0;
    --warn: #ca8a04;
    --error: #dc2626;
    --info: #2563eb;
    --btn-bg: #f0ede6;
    --btn-bg-hover: #e6e2d8;
    --input-bg: #faf9f6;
    --dot-close: #e84040;
    --dot-minimize: #dba020;
    --dot-maximize: #1fa835;
    color-scheme: light;
  }

  * { box-sizing: border-box; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'IBM Plex Mono', ui-monospace, 'Cascadia Code', monospace;
    font-size: 13px;
    line-height: 1.5;
    padding-inline: 16px;
    padding-block: 0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  /* ── Top bar ── */
  .topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    flex-wrap: wrap;
    padding: 12px 0 10px;
    border-bottom: 1px solid var(--border);
    margin-bottom: 10px;
    position: sticky;
    top: env(safe-area-inset-top, 0px);
    background: var(--bg);
    z-index: 10;
  }
  .topbar-left { display: flex; align-items: center; gap: 12px; }
  .wordmark {
    font-family: 'Big Shoulders Display', system-ui, sans-serif;
    font-weight: 800; font-size: 20px; letter-spacing: 0.02em;
    color: var(--text-bright); white-space: nowrap;
  }
  .wordmark span { color: var(--prompt); }
  .topbar-right {
    display: flex; align-items: center; gap: 8px;
    font-size: 11px; color: var(--dim);
  }
  .topbar-right .host { color: var(--text); font-weight: 500; }

  /* ── Connection bar ── */
  .conn-bar {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
    padding: 8px 0 10px;
    border-bottom: 1px solid var(--border);
    margin-bottom: 10px;
  }
  .conn-bar-label {
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--dim);
    margin-right: 2px;
  }
  .quick-btn {
    display: inline-flex; align-items: center; gap: 5px;
    background: var(--btn-bg);
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--text);
    font-family: inherit; font-size: 11.5px;
    padding: 5px 10px;
    cursor: pointer;
    transition: border-color 0.15s, background 0.15s, color 0.15s;
    white-space: nowrap;
  }
  .quick-btn:hover { background: var(--btn-bg-hover); border-color: var(--border-focus); }
  .quick-btn:focus-visible { outline: 2px solid var(--info); outline-offset: 1px; }
  .quick-btn .dot {
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--dim); flex-shrink: 0;
  }
  .quick-btn.active .dot { background: var(--success); box-shadow: 0 0 4px var(--success); }
  .quick-btn.active { border-color: var(--border-active); color: var(--text-bright); }
  .quick-btn .remove {
    margin-left: 2px; font-size: 13px; color: var(--dim);
    cursor: pointer; line-height: 1;
  }
  .quick-btn .remove:hover { color: var(--error); }

  .manual-connect {
    display: inline-flex; align-items: center; gap: 4px;
    margin-left: auto;
  }
  .manual-connect input {
    background: var(--input-bg);
    border: 1px solid var(--border);
    border-radius: 5px;
    color: var(--text);
    font-family: inherit; font-size: 11.5px;
    padding: 5px 8px;
    width: 180px;
    outline: none;
  }
  .manual-connect input::placeholder { color: var(--dim); }
  .manual-connect input:focus { border-color: var(--border-focus); }
  .manual-connect button {
    background: var(--prompt);
    border: none;
    border-radius: 5px;
    color: var(--bg);
    font-family: inherit; font-size: 11px; font-weight: 600;
    padding: 5px 10px;
    cursor: pointer;
    letter-spacing: 0.02em;
  }
  .manual-connect button:hover { filter: brightness(1.1); }
  .manual-connect button:focus-visible { outline: 2px solid var(--info); outline-offset: 1px; }

  /* ── Grid ── */
  .grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    flex: 1;
    padding-bottom: 16px;
  }
  @media (max-width: 820px) { .grid { grid-template-columns: 1fr; } }

  /* ── Terminal pane ── */
  .term {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    display: flex; flex-direction: column;
    overflow: hidden;
    min-height: 200px;
  }
  .term.connected { border-color: var(--border-focus); }
  .term-titlebar {
    display: flex; align-items: center; gap: 8px;
    padding: 7px 10px;
    background: var(--panel-raised);
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }
  .dots { display: flex; gap: 5px; }
  .dots i { width: 10px; height: 10px; border-radius: 50%; display: block; }
  .dots i:nth-child(1) { background: var(--dot-close); }
  .dots i:nth-child(2) { background: var(--dot-minimize); }
  .dots i:nth-child(3) { background: var(--dot-maximize); }
  .dots.off i { background: var(--dim); opacity: 0.3; }
  .term-title {
    flex: 1; text-align: center;
    font-size: 11px; font-weight: 500;
    color: var(--dim); letter-spacing: 0.02em;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .term-title .conn-host { color: var(--text); }

  /* ── Quick commands row ── */
  .cmd-row {
    display: flex; gap: 4px; flex-wrap: wrap;
    padding: 5px 10px;
    border-bottom: 1px solid var(--border);
    background: var(--panel-raised);
  }
  .cmd-btn {
    background: var(--btn-bg);
    border: 1px solid var(--border);
    border-radius: 4px;
    color: var(--dim);
    font-family: inherit; font-size: 10px;
    padding: 2px 7px;
    cursor: pointer;
    transition: color 0.15s, border-color 0.15s;
  }
  .cmd-btn:hover { color: var(--text); border-color: var(--border-focus); }
  .cmd-btn:focus-visible { outline: 2px solid var(--info); outline-offset: 1px; }
  .cmd-btn.active { color: var(--prompt); border-color: var(--prompt-dim); }

  /* ── Terminal body ── */
  .term-body {
    flex: 1; padding: 8px 10px;
    overflow-y: auto; overflow-x: auto;
    font-size: 12px;
    font-variant-numeric: tabular-nums;
  }
  .term-body pre { margin: 0; white-space: pre-wrap; word-break: break-all; }

  .line { min-height: 1.45em; }
  .line.cmd { color: var(--text-bright); }
  .line.cmd .ps1 { color: var(--prompt); font-weight: 600; }
  .line.cmd .h { color: var(--success); }
  .line.cmd .p { color: var(--info); }
  .line.out { color: var(--text); }
  .line.dim { color: var(--dim); }
  .line .ok { color: var(--success); }
  .line .w { color: var(--warn); }
  .line .e { color: var(--error); }
  .line .v { color: var(--text-bright); font-weight: 500; }
  .line .l { color: var(--dim); }
  .line .a { color: var(--prompt); }
  .line .i { color: var(--info); }

  .cursor {
    display: inline-block; width: 7px; height: 13px;
    background: var(--prompt); vertical-align: text-bottom;
    animation: blink 1s step-end infinite;
  }
  @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }

  .status-row {
    display: flex; gap: 12px; flex-wrap: wrap;
    padding: 6px 0 2px;
    border-top: 1px solid var(--border);
    margin-top: 4px;
  }
  .status-chip {
    display: flex; align-items: center; gap: 4px;
    font-size: 10px; color: var(--dim);
  }
  .chip-dot {
    width: 5px; height: 5px; border-radius: 50%;
  }
  .chip-dot.g { background: var(--success); }
  .chip-dot.a { background: var(--warn); }
  .chip-dot.r { background: var(--error); }

  /* ── Empty panel state ── */
  .empty-state {
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    flex: 1; gap: 8px; color: var(--dim);
    font-size: 12px; text-align: center;
    padding: 20px;
  }
  .empty-state .icon { font-size: 28px; opacity: 0.3; }

  /* ── Panel selector ── */
  .panel-selector {
    display: flex; gap: 4px; align-items: center;
  }
  .panel-num {
    width: 22px; height: 22px;
    display: flex; align-items: center; justify-content: center;
    border-radius: 4px; border: 1px solid var(--border);
    background: var(--btn-bg);
    color: var(--dim); font-size: 10px; font-weight: 600;
    cursor: pointer;
  }
  .panel-num.active { border-color: var(--prompt); color: var(--prompt); }

  @media (prefers-reduced-motion: reduce) {
    .cursor { animation: none; }
  }
</style>

<div class="topbar">
  <div class="topbar-left">
    <div class="wordmark">PHASE<span>·</span>CONSOLE</div>
    <div class="panel-selector" id="panelSelector"></div>
  </div>
  <div class="topbar-right">
    <span id="activeCount" style="color:var(--success)">0</span>
    <span>active</span>
    <span style="margin: 0 2px;">·</span>
    <span id="clockLabel">--:--:--</span>
  </div>
</div>

<div class="conn-bar" id="connBar">
  <span class="conn-bar-label">Hosts</span>
  <div id="savedHosts"></div>
  <div class="manual-connect">
    <input type="text" id="manualInput" placeholder="user@host" spellcheck="false" autocomplete="off">
    <button id="connectBtn">Connect</button>
  </div>
</div>

<div class="grid" id="grid"></div>

<script>
(function () {
  "use strict";

  const MAX_PANELS = 4;

  function esc(s) { return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
  function t(c, s) { return '<span class="'+c+'">'+esc(s)+'</span>'; }

  function ps1(user, host, path) {
    return '<span class="ps1"><span class="h">'+esc(user)+'@'+esc(host)+'</span>:<span class="p">'+esc(path||'~')+'</span>$ </span>';
  }
  function cmdLine(user, host, text, path) {
    return ps1(user, host, path) + esc(text);
  }

  // ── Quick command definitions per host pattern ──
  const QUICK_CMDS = {
    _default: [
      { label: "audio", cmd: "pactl info | grep -E 'Server|Default Sink'" },
      { label: "uptime", cmd: "uptime -p" },
      { label: "mem", cmd: "free -h | head -2" },
      { label: "disk", cmd: "df -h / | tail -1" },
      { label: "temp", cmd: "sensors 2>/dev/null | grep -i 'core 0' || echo 'no sensors'" },
      { label: "top5", cmd: "ps aux --sort=-%mem | head -6" },
    ],
    htpc: [
      { label: "audio", cmd: "pactl info | grep -E 'Server|Default Sink'" },
      { label: "sink", cmd: "pactl list sinks short" },
      { label: "vol", cmd: "pactl get-sink-volume @DEFAULT_SINK@" },
      { label: "entrainment", cmd: "cd ~/BIL && python3 -m vibroacoustic_entrainment.cli --show-audio-info" },
      { label: "render", cmd: "cd ~/BIL && python3 -m vibroacoustic_entrainment.cli --match-system --protocol focus10 --out-dir ~/entrainment_out/" },
      { label: "play", cmd: "paplay ~/entrainment_out/audio.wav &" },
    ],
  };

  function getCmdsFor(host) {
    const lower = host.toLowerCase();
    for (const key of Object.keys(QUICK_CMDS)) {
      if (key !== "_default" && lower.includes(key)) return QUICK_CMDS[key];
    }
    return QUICK_CMDS._default;
  }

  // ── Simulated command outputs ──
  const SIM_OUTPUTS = {
    'pactl info | grep -E \'Server|Default Sink\'': [
      { type:"out", text:'Server Name: <span class="v">PipeWire (version 1.0)</span>' },
      { type:"out", text:'Default Sink: <span class="v">alsa_output.pci-0000_00_1f.3.hdmi-stereo</span>' },
    ],
    'pactl list sinks short': [
      { type:"out", text:'60  alsa_output.pci-0000_00_1f.3.hdmi-stereo  <span class="v">PipeWire</span>  <span class="i">s32le 2ch 48000Hz</span>  <span class="ok">RUNNING</span>' },
    ],
    'pactl get-sink-volume @DEFAULT_SINK@': [
      { type:"out", text:'Volume: front-left: 26214 /<span class="v"> 40%</span> / -23.88 dB,   front-right: 26214 /<span class="v"> 40%</span> / -23.88 dB' },
    ],
    'uptime -p': [
      { type:"out", text:'up <span class="v">14 days, 7:23</span>' },
    ],
    'free -h | head -2': [
      { type:"out", text:'<span class="l">              total        used        free      shared  buff/cache   available</span>' },
      { type:"out", text:'Mem:       <span class="v">  16Gi</span>       <span class="w">6.2Gi</span>       <span class="ok">4.1Gi</span>       312Mi       5.7Gi       <span class="ok">9.2Gi</span>' },
    ],
    'df -h / | tail -1': [
      { type:"out", text:'/dev/nvme0n1p2  <span class="v">468G</span>   <span class="w">142G</span>   <span class="ok">302G</span>  32% /' },
    ],
    'sensors 2>/dev/null | grep -i \'core 0\' || echo \'no sensors\'': [
      { type:"out", text:'Core 0:       +<span class="ok">42.0</span>°C  (high = +100.0°C, crit = +100.0°C)' },
    ],
    'ps aux --sort=-%mem | head -6': [
      { type:"out", text:'<span class="l">USER       PID %CPU %MEM    VSZ   RSS TTY  STAT START   TIME COMMAND</span>' },
      { type:"out", text:'htpc      1842  2.1 <span class="w"> 8.4</span> 1842392 1381024 ?  Sl   Sep11  48:02 /usr/bin/kodi' },
      { type:"out", text:'htpc      2103  0.8 <span class="v"> 3.2</span>  986244  527616 ?  Sl   Sep11  19:44 pipewire' },
      { type:"out", text:'htpc      1201  0.3 <span class="v"> 1.8</span>  642100  296448 ?  Ssl  Sep11   7:12 /usr/bin/Xwayland' },
      { type:"out", text:'root       412  0.0 <span class="v"> 0.4</span>  281660   65536 ?  Ss   Sep11   0:34 /usr/lib/systemd/systemd' },
    ],
    'cd ~/BIL && python3 -m vibroacoustic_entrainment.cli --show-audio-info': [
      { type:"out", text:'System audio output:' },
      { type:"out", text:'  Sink:        <span class="v">alsa_output.pci-0000_00_1f.3.hdmi-stereo</span>' },
      { type:"out", text:'  Server:      <span class="v">PipeWire (version 1.0)</span>' },
      { type:"out", text:'  Sample rate: <span class="i">48000</span> Hz' },
      { type:"out", text:'  Format:      <span class="i">s32le</span> (<span class="v">32</span>-bit)' },
      { type:"out", text:'  Channels:    <span class="v">2</span>' },
      { type:"out", text:'  Volume:      <span class="v">40</span>%' },
      { type:"out", text:'  Muted:       <span class="ok">False</span>' },
    ],
    'cd ~/BIL && python3 -m vibroacoustic_entrainment.cli --match-system --protocol focus10 --out-dir ~/entrainment_out/': [
      { type:"out", text:'  -> Using: <span class="ok">48000</span> Hz, <span class="ok">32</span>-bit' },
      { type:"out", text:'Rendered <span class="a">\'gateway_focus10\'</span> (<span class="v">1800</span>s) -> ~/entrainment_out/' },
      { type:"out", text:'  <span class="v">audio.wav</span>' },
      { type:"out", text:'  <span class="v">haptic.wav</span>' },
      { type:"out", text:'  <span class="v">photic_events.json</span>' },
    ],
    'paplay ~/entrainment_out/audio.wav &': [
      { type:"out", text:'[1] 48291' },
      { type:"out", text:'<span class="ok">▶ Playing</span> gateway_focus10 — 30:00 remaining' },
    ],
  };

  // ── Saved hosts (localStorage) ──
  function loadHosts() {
    try {
      const raw = localStorage.getItem("phase_console_hosts");
      if (raw) return JSON.parse(raw);
    } catch(e) {}
    return [
      { user: "htpc", host: "htpc", label: "htpc" },
    ];
  }
  function saveHosts(hosts) {
    try { localStorage.setItem("phase_console_hosts", JSON.stringify(hosts)); } catch(e) {}
  }

  let savedHosts = loadHosts();

  // ── Panel state ──
  const panels = [];
  for (let i = 0; i < MAX_PANELS; i++) {
    panels.push({ id: i, connection: null, lines: [], el: null });
  }
  let activePanel = 0;

  // ── Rendering ──
  const grid = document.getElementById("grid");
  const savedHostsEl = document.getElementById("savedHosts");
  const panelSelector = document.getElementById("panelSelector");

  function renderSavedHosts() {
    let html = "";
    savedHosts.forEach((h, idx) => {
      const isActive = panels.some(p => p.connection && p.connection.host === h.host && p.connection.user === h.user);
      html += '<button class="quick-btn'+(isActive ? ' active' : '')+'" data-host-idx="'+idx+'">' +
        '<span class="dot"></span>' +
        esc(h.label || h.user+"@"+h.host) +
        '<span class="remove" data-remove="'+idx+'" title="Remove saved host">×</span>' +
        '</button>';
    });
    savedHostsEl.innerHTML = html;

    savedHostsEl.querySelectorAll("[data-host-idx]").forEach(btn => {
      btn.addEventListener("click", (e) => {
        if (e.target.dataset.remove !== undefined) return;
        const h = savedHosts[parseInt(btn.dataset.hostIdx)];
        connectPanel(activePanel, h.user, h.host);
      });
    });
    savedHostsEl.querySelectorAll("[data-remove]").forEach(x => {
      x.addEventListener("click", (e) => {
        e.stopPropagation();
        const idx = parseInt(x.dataset.remove);
        savedHosts.splice(idx, 1);
        saveHosts(savedHosts);
        renderSavedHosts();
      });
    });
  }

  function renderPanelSelector() {
    let html = "";
    for (let i = 0; i < MAX_PANELS; i++) {
      const cls = i === activePanel ? " active" : "";
      html += '<div class="panel-num'+cls+'" data-panel="'+i+'">'+(i+1)+'</div>';
    }
    panelSelector.innerHTML = html;
    panelSelector.querySelectorAll("[data-panel]").forEach(el => {
      el.addEventListener("click", () => {
        activePanel = parseInt(el.dataset.panel);
        renderPanelSelector();
      });
    });
  }

  function buildPanel(idx) {
    const panel = panels[idx];
    const term = document.createElement("div");
    term.className = "term" + (panel.connection ? " connected" : "");
    term.id = "term-" + idx;

    const conn = panel.connection;
    const titleText = conn
      ? 'ssh <span class="conn-host">' + esc(conn.user) + "@" + esc(conn.host) + "</span>"
      : "Panel " + (idx + 1) + " — not connected";

    const titlebar = document.createElement("div");
    titlebar.className = "term-titlebar";
    titlebar.innerHTML =
      '<div class="dots' + (conn ? "" : " off") + '"><i></i><i></i><i></i></div>' +
      '<div class="term-title">' + titleText + "</div>";

    term.appendChild(titlebar);

    if (conn) {
      const cmds = getCmdsFor(conn.host);
      const cmdRow = document.createElement("div");
      cmdRow.className = "cmd-row";
      cmds.forEach((c, ci) => {
        const btn = document.createElement("button");
        btn.className = "cmd-btn";
        btn.textContent = c.label;
        btn.title = c.cmd;
        btn.addEventListener("click", () => runCommand(idx, c.cmd));
        cmdRow.appendChild(btn);
      });
      const disconnBtn = document.createElement("button");
      disconnBtn.className = "cmd-btn";
      disconnBtn.textContent = "✕";
      disconnBtn.title = "Disconnect";
      disconnBtn.style.marginLeft = "auto";
      disconnBtn.style.color = "var(--error)";
      disconnBtn.addEventListener("click", () => disconnectPanel(idx));
      cmdRow.appendChild(disconnBtn);
      term.appendChild(cmdRow);
    }

    const body = document.createElement("div");
    body.className = "term-body";
    const pre = document.createElement("pre");
    pre.id = "output-" + idx;
    body.appendChild(pre);
    term.appendChild(body);

    if (!conn) {
      const empty = document.createElement("div");
      empty.className = "empty-state";
      empty.innerHTML = '<div class="icon">□</div><div>Select a host or enter<br>user@host to connect</div>';
      body.innerHTML = "";
      body.appendChild(empty);
    }

    panel.el = { term, pre };
    return term;
  }

  function renderGrid() {
    grid.innerHTML = "";
    panels.forEach((p, i) => {
      grid.appendChild(buildPanel(i));
    });
    updateActiveCount();
    renderSavedHosts();
    renderPanelSelector();
  }

  function updateActiveCount() {
    const count = panels.filter(p => p.connection).length;
    document.getElementById("activeCount").textContent = count;
  }

  function connectPanel(idx, user, host) {
    const panel = panels[idx];
    panel.connection = { user, host };
    panel.lines = [];

    const exists = savedHosts.some(h => h.user === user && h.host === host);
    if (!exists) {
      savedHosts.push({ user, host, label: user === host ? host : user + "@" + host });
      saveHosts(savedHosts);
    }

    renderGrid();
    appendOutput(idx, "dim", '<span class="ok">●</span> Connected to ' + esc(user) + "@" + esc(host));
    appendCursor(idx);
  }

  function disconnectPanel(idx) {
    panels[idx].connection = null;
    panels[idx].lines = [];
    renderGrid();
  }

  function appendOutput(idx, type, html) {
    const pre = panels[idx].el?.pre;
    if (!pre) return;
    removeCursor(idx);
    const div = document.createElement("div");
    div.className = "line " + type;
    div.innerHTML = html;
    pre.appendChild(div);
    pre.parentElement.scrollTop = pre.parentElement.scrollHeight;
  }

  function appendCursor(idx) {
    const pre = panels[idx].el?.pre;
    if (!pre) return;
    const conn = panels[idx].connection;
    if (!conn) return;
    const div = document.createElement("div");
    div.className = "line cmd cursor-line";
    div.innerHTML = ps1(conn.user, conn.host, "~") + '<span class="cursor"></span>';
    pre.appendChild(div);
    pre.parentElement.scrollTop = pre.parentElement.scrollHeight;
  }

  function removeCursor(idx) {
    const pre = panels[idx].el?.pre;
    if (!pre) return;
    const cur = pre.querySelector(".cursor-line");
    if (cur) cur.remove();
  }

  function runCommand(idx, cmd) {
    const conn = panels[idx].connection;
    if (!conn) return;

    appendOutput(idx, "cmd", cmdLine(conn.user, conn.host, cmd));

    const outputs = SIM_OUTPUTS[cmd];
    if (outputs) {
      let i = 0;
      const delay = 20;
      function next() {
        if (i >= outputs.length) {
          appendCursor(idx);
          return;
        }
        const o = outputs[i];
        appendOutput(idx, o.type, o.text);
        i++;
        setTimeout(next, delay);
      }
      setTimeout(next, 60);
    } else {
      setTimeout(() => {
        appendOutput(idx, "dim", esc(cmd) + ': simulated output not available');
        appendCursor(idx);
      }, 80);
    }
  }

  // ── Manual connect ──
  const manualInput = document.getElementById("manualInput");
  const connectBtn = document.getElementById("connectBtn");

  function doManualConnect() {
    const val = manualInput.value.trim();
    if (!val) return;
    let user = "user", host = val;
    if (val.includes("@")) {
      const parts = val.split("@");
      user = parts[0] || "user";
      host = parts.slice(1).join("@");
    }
    const freePanel = panels.findIndex(p => !p.connection);
    const target = freePanel >= 0 ? freePanel : activePanel;
    connectPanel(target, user, host);
    activePanel = target;
    renderPanelSelector();
    manualInput.value = "";
  }

  connectBtn.addEventListener("click", doManualConnect);
  manualInput.addEventListener("keydown", (e) => {
    if (e.key === "Enter") doManualConnect();
  });

  // ── Clock ──
  function updateClock() {
    const now = new Date();
    document.getElementById("clockLabel").textContent =
      now.toLocaleTimeString([], { hour:"2-digit", minute:"2-digit", second:"2-digit" });
  }
  updateClock();
  setInterval(updateClock, 1000);

  // ── Init: auto-connect panel 0 to htpc ──
  renderGrid();
  connectPanel(0, "htpc", "htpc");
  setTimeout(() => runCommand(0, "pactl info | grep -E 'Server|Default Sink'"), 600);
  setTimeout(() => runCommand(0, "pactl list sinks short"), 1800);

})();
</script>
