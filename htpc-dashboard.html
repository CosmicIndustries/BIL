<title>Phase Console HTPC</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap');

  :root {
    --bg: #090c11;
    --panel: #111620;
    --panel-raised: #161d2a;
    --border: #1e2736;
    --border-focus: #2a3548;
    --text: #c8cdd6;
    --text-bright: #e8ecf2;
    --dim: #4a5568;
    --prompt: #e8a840;
    --prompt-dim: #b07520;
    --success: #4ade80;
    --success-dim: #166534;
    --warn: #fbbf24;
    --error: #f87171;
    --info: #60a5fa;
    --band-alpha: #3ddc97;
    --band-theta: #ffb84d;
    --band-delta: #c86dff;
    --dot-close: #ff5f57;
    --dot-minimize: #febc2e;
    --dot-maximize: #28c840;
    color-scheme: dark;
  }
  @media (prefers-color-scheme: light) {
    :root:not([data-theme="light"]) {
      --bg: #090c11;
      --panel: #111620;
      --panel-raised: #161d2a;
      --border: #1e2736;
      --border-focus: #2a3548;
      --text: #c8cdd6;
      --text-bright: #e8ecf2;
      --dim: #4a5568;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #090c11;
    --panel: #111620;
    --panel-raised: #161d2a;
    --border: #1e2736;
    --border-focus: #2a3548;
    --text: #c8cdd6;
    --text-bright: #e8ecf2;
    --dim: #4a5568;
    color-scheme: dark;
  }
  :root[data-theme="light"] {
    --bg: #f0ede6;
    --panel: #ffffff;
    --panel-raised: #f7f5f0;
    --border: #d4cfc4;
    --border-focus: #bbb5a8;
    --text: #2d2a24;
    --text-bright: #1a1815;
    --dim: #8a8478;
    --prompt: #9e6a10;
    --success: #16a34a;
    --success-dim: #bbf7d0;
    --error: #dc2626;
    --info: #2563eb;
    --dot-close: #e84040;
    --dot-minimize: #dba020;
    --dot-maximize: #1fa835;
    color-scheme: light;
  }

  * { box-sizing: border-box; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'IBM Plex Mono', ui-monospace, 'Cascadia Code', 'Fira Code', monospace;
    font-size: 13px;
    line-height: 1.55;
    padding-inline: 16px;
    padding-block: 0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  .topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    flex-wrap: wrap;
    padding: 16px 0 12px;
    border-bottom: 1px solid var(--border);
    margin-bottom: 16px;
    position: sticky;
    top: env(safe-area-inset-top, 0px);
    background: var(--bg);
    z-index: 10;
  }
  .topbar-left {
    display: flex;
    align-items: center;
    gap: 14px;
  }
  .wordmark {
    font-family: 'Big Shoulders Display', system-ui, sans-serif;
    font-weight: 800;
    font-size: 22px;
    letter-spacing: 0.02em;
    color: var(--text-bright);
    white-space: nowrap;
  }
  .wordmark span { color: var(--prompt); }
  .conn-badge {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 11px;
    font-weight: 500;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    padding: 4px 10px;
    border-radius: 999px;
    border: 1px solid var(--border);
    background: var(--panel);
  }
  .conn-badge .dot {
    width: 7px; height: 7px;
    border-radius: 50%;
    background: var(--success);
    box-shadow: 0 0 6px var(--success);
    animation: pulse 2.4s ease-in-out infinite;
  }
  .conn-badge.offline .dot {
    background: var(--error);
    box-shadow: 0 0 6px var(--error);
    animation: none;
  }
  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.4; }
  }
  .topbar-right {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 11px;
    color: var(--dim);
  }
  .topbar-right .host {
    color: var(--text);
    font-weight: 500;
  }

  .grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 14px;
    flex: 1;
    padding-bottom: 20px;
  }
  @media (max-width: 820px) {
    .grid { grid-template-columns: 1fr; }
  }

  .term {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    min-height: 260px;
  }
  .term:focus-within {
    border-color: var(--border-focus);
  }
  .term-titlebar {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 14px;
    background: var(--panel-raised);
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }
  .dots {
    display: flex;
    gap: 6px;
  }
  .dots i {
    width: 11px; height: 11px;
    border-radius: 50%;
    display: block;
  }
  .dots i:nth-child(1) { background: var(--dot-close); }
  .dots i:nth-child(2) { background: var(--dot-minimize); }
  .dots i:nth-child(3) { background: var(--dot-maximize); }
  .term-title {
    flex: 1;
    text-align: center;
    font-size: 11.5px;
    font-weight: 500;
    color: var(--dim);
    letter-spacing: 0.02em;
  }
  .term-actions {
    display: flex;
    gap: 4px;
  }
  .term-actions button {
    background: none;
    border: 1px solid var(--border);
    border-radius: 4px;
    color: var(--dim);
    font-family: inherit;
    font-size: 10px;
    padding: 2px 7px;
    cursor: pointer;
    transition: color 0.15s, border-color 0.15s;
  }
  .term-actions button:hover {
    color: var(--text);
    border-color: var(--border-focus);
  }
  .term-actions button:focus-visible {
    outline: 2px solid var(--info);
    outline-offset: 1px;
  }
  .term-body {
    flex: 1;
    padding: 12px 14px;
    overflow-y: auto;
    overflow-x: auto;
    font-size: 12.5px;
    font-variant-numeric: tabular-nums;
  }
  .term-body pre {
    margin: 0;
    white-space: pre-wrap;
    word-break: break-all;
  }

  .line { min-height: 1.55em; }
  .line.cmd { color: var(--text-bright); }
  .line.cmd .ps1 { color: var(--prompt); font-weight: 600; }
  .line.cmd .host-part { color: var(--success); }
  .line.cmd .path-part { color: var(--info); }
  .line.out { color: var(--text); }
  .line.dim { color: var(--dim); }
  .line .ok { color: var(--success); }
  .line .warn { color: var(--warn); }
  .line .err { color: var(--error); }
  .line .val { color: var(--text-bright); font-weight: 500; }
  .line .label { color: var(--dim); }
  .line .accent { color: var(--prompt); }
  .line .info { color: var(--info); }

  .cursor {
    display: inline-block;
    width: 7px;
    height: 14px;
    background: var(--prompt);
    vertical-align: text-bottom;
    animation: blink 1s step-end infinite;
  }
  @keyframes blink {
    0%, 100% { opacity: 1; }
    50% { opacity: 0; }
  }

  .status-row {
    display: flex;
    gap: 16px;
    flex-wrap: wrap;
    padding: 8px 0 4px;
    border-top: 1px solid var(--border);
    margin-top: 6px;
  }
  .status-chip {
    display: flex;
    align-items: center;
    gap: 5px;
    font-size: 11px;
    color: var(--dim);
  }
  .status-chip .indicator {
    width: 6px; height: 6px;
    border-radius: 50%;
  }
  .status-chip .indicator.green { background: var(--success); }
  .status-chip .indicator.amber { background: var(--warn); }
  .status-chip .indicator.red { background: var(--error); }

  @media (prefers-reduced-motion: reduce) {
    .cursor, .conn-badge .dot { animation: none; }
  }
</style>

<div class="topbar">
  <div class="topbar-left">
    <div class="wordmark">PHASE<span>·</span>CONSOLE <span style="font-weight:700;font-size:16px;">HTPC</span></div>
    <div class="conn-badge" id="connBadge">
      <div class="dot"></div>
      <span id="connLabel">connected</span>
    </div>
  </div>
  <div class="topbar-right">
    <span class="host" id="hostLabel">htpc@htpc</span>
    <span>·</span>
    <span id="clockLabel">—</span>
  </div>
</div>

<div class="grid" id="grid"></div>

<script>
(function () {
  "use strict";

  const HOST = "htpc";
  const USER = "htpc";
  const PS1_PREFIX = `<span class="host-part">${USER}@${HOST}</span>:<span class="path-part">~</span>`;

  function cmd(text) {
    return `<span class="ps1">${PS1_PREFIX}$ </span>${esc(text)}`;
  }
  function esc(s) {
    return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
  }
  function tag(cls, text) { return `<span class="${cls}">${esc(text)}</span>`; }

  const PANES = [
    {
      id: "audio",
      title: `ssh ${USER}@${HOST} — audio output`,
      lines() {
        return [
          { type:"cmd", html: cmd("pactl info | grep -E 'Server Name|Default Sink'") },
          { type:"out", html: `Server Name: ${tag("val","PipeWire (version 1.0)")}` },
          { type:"out", html: `Default Sink: ${tag("val","alsa_output.pci-0000_00_1f.3.hdmi-stereo")}` },
          { type:"dim", html: "" },
          { type:"cmd", html: cmd("pactl list sinks short") },
          { type:"out", html: `60  alsa_output.pci-0000_00_1f.3.hdmi-stereo  ${tag("val","PipeWire")}  ${tag("info","s32le 2ch 48000Hz")}  ${tag("ok","RUNNING")}` },
          { type:"dim", html: "" },
          { type:"cmd", html: cmd("pactl get-sink-volume @DEFAULT_SINK@") },
          { type:"out", html: `Volume: front-left: 26214 / ${tag("val"," 40%")} / -23.88 dB,   front-right: 26214 / ${tag("val"," 40%")} / -23.88 dB` },
          { type:"out", html: `balance ${tag("val","0.00")}` },
          { type:"dim", html: "" },
          { type:"cmd", html: cmd("pactl get-sink-mute @DEFAULT_SINK@") },
          { type:"out", html: `Mute: ${tag("ok","no")}` },
        ];
      },
      status: [
        { color:"green", label:"PipeWire" },
        { color:"green", label:"HDMI Stereo" },
        { color:"green", label:"48kHz S32LE" },
        { color:"amber", label:"40%" },
      ]
    },
    {
      id: "system",
      title: `ssh ${USER}@${HOST} — system`,
      lines() {
        const now = new Date();
        const up = "14 days, 7:23";
        return [
          { type:"cmd", html: cmd("uptime -p && uname -r") },
          { type:"out", html: `up ${tag("val", up)}` },
          { type:"out", html: tag("val","6.18.44-fc-v37") },
          { type:"dim", html: "" },
          { type:"cmd", html: cmd("free -h | head -2") },
          { type:"out", html: `${tag("label","              total        used        free      shared  buff/cache   available")}` },
          { type:"out", html: `Mem:       ${tag("val","  16Gi")}       ${tag("warn","6.2Gi")}       ${tag("ok","4.1Gi")}       312Mi       5.7Gi       ${tag("ok","9.2Gi")}` },
          { type:"dim", html: "" },
          { type:"cmd", html: cmd("df -h / /home | tail -2") },
          { type:"out", html: `/dev/nvme0n1p2  ${tag("val","468G")}   ${tag("warn","142G")}   ${tag("ok","302G")}  32% /` },
          { type:"out", html: `/dev/nvme0n1p3  ${tag("val","931G")}   ${tag("ok"," 89G")}   ${tag("ok","798G")}  10% /home` },
          { type:"dim", html: "" },
          { type:"cmd", html: cmd("sensors 2>/dev/null | grep -i 'core 0'") },
          { type:"out", html: `Core 0:       +${tag("ok","42.0")}°C  (high = +100.0°C, crit = +100.0°C)` },
        ];
      },
      status: [
        { color:"green", label:"Kernel 6.18" },
        { color:"green", label:"16 GiB RAM" },
        { color:"green", label:"42°C" },
      ]
    },
    {
      id: "entrainment",
      title: `ssh ${USER}@${HOST} — entrainment engine`,
      lines() {
        return [
          { type:"cmd", html: cmd("cd ~/BIL && python3 -m vibroacoustic_entrainment.cli --show-audio-info") },
          { type:"out", html: `System audio output:` },
          { type:"out", html: `  Sink:        ${tag("val","alsa_output.pci-0000_00_1f.3.hdmi-stereo")}` },
          { type:"out", html: `  Server:      ${tag("val","PipeWire (version 1.0)")}` },
          { type:"out", html: `  Sample rate: ${tag("info","48000")} Hz` },
          { type:"out", html: `  Format:      ${tag("info","s32le")} (${tag("val","32")}-bit)` },
          { type:"out", html: `  Channels:    ${tag("val","2")}` },
          { type:"out", html: `  Volume:      ${tag("val","40")}%` },
          { type:"out", html: `  Muted:       ${tag("ok","False")}` },
          { type:"dim", html: "" },
          { type:"cmd", html: cmd("python3 -m vibroacoustic_entrainment.cli --match-system --protocol obe_phase --out-dir ~/entrainment_out/") },
          { type:"out", html: `System audio output:` },
          { type:"out", html: `  Sink:        alsa_output.pci-0000_00_1f.3.hdmi-stereo` },
          { type:"out", html: `  Server:      PipeWire (version 1.0)` },
          { type:"out", html: `  Sample rate: 48000 Hz` },
          { type:"out", html: `  Format:      s32le (32-bit)` },
          { type:"out", html: `  Channels:    2` },
          { type:"out", html: `  Volume:      40%` },
          { type:"out", html: `  Muted:       False` },
          { type:"out", html: `  -> Using: ${tag("ok","48000")} Hz, ${tag("ok","32")}-bit` },
          { type:"out", html: `Rendered ${tag("accent","'hyper_cognition_obe_phase_protocol'")} (${tag("val","2160")}s) -> ~/entrainment_out/` },
          { type:"out", html: `  ${tag("val","audio.wav")}` },
          { type:"out", html: `  ${tag("val","haptic.wav")}` },
          { type:"out", html: `  ${tag("val","haptic_envelope.json")}` },
          { type:"out", html: `  ${tag("val","photic_events.json")}` },
        ];
      },
      status: [
        { color:"green", label:"Matched 48kHz" },
        { color:"green", label:"32-bit" },
        { color:"green", label:"OBE Phase rendered" },
      ]
    },
    {
      id: "verify",
      title: `ssh ${USER}@${HOST} — wav verification`,
      lines() {
        return [
          { type:"cmd", html: cmd("python3 -c \"import wave; w=wave.open('entrainment_out/audio.wav'); print(f'Rate: {w.getframerate()} Hz'); print(f'Depth: {w.getsampwidth()*8}-bit'); print(f'Ch: {w.getnchannels()}'); print(f'Dur: {w.getnframes()/w.getframerate():.0f}s')\"") },
          { type:"out", html: `Rate:  ${tag("ok","48000")} Hz` },
          { type:"out", html: `Depth: ${tag("ok","32")}-bit` },
          { type:"out", html: `Ch:    ${tag("ok","2")}` },
          { type:"out", html: `Dur:   ${tag("val","2160")}s` },
          { type:"dim", html: "" },
          { type:"cmd", html: cmd("speaker-test -t wav -c 2 -l 1 2>&1 | head -8") },
          { type:"out", html: `speaker-test 1.2.9` },
          { type:"out", html: `Playback device is default` },
          { type:"out", html: `Stream parameters are ${tag("info","48000Hz")}, ${tag("info","S16_LE")}, ${tag("info","2 channels")}` },
          { type:"out", html: `WAV file(s)` },
          { type:"out", html: `Rate set to ${tag("ok","48000Hz")} (requested 48000Hz)` },
          { type:"out", html: `Using max buffer size 1048576` },
          { type:"out", html: `0 - ${tag("val","Front Left")}` },
          { type:"out", html: `1 - ${tag("val","Front Right")}` },
          { type:"dim", html: "" },
          { type:"cmd", html: cmd("paplay entrainment_out/audio.wav &") },
          { type:"out", html: `[1] 48291` },
          { type:"dim", html: "" },
          { type:"out", html: `${tag("ok","▶ Playing")} hyper_cognition_obe_phase_protocol — 36:00 remaining` },
        ];
      },
      status: [
        { color:"green", label:"48kHz native" },
        { color:"green", label:"32-bit matched" },
        { color:"green", label:"Playing" },
      ]
    },
  ];

  function buildPane(pane) {
    const term = document.createElement("div");
    term.className = "term";
    term.id = `term-${pane.id}`;

    const titlebar = document.createElement("div");
    titlebar.className = "term-titlebar";
    titlebar.innerHTML = `
      <div class="dots"><i></i><i></i><i></i></div>
      <div class="term-title">${esc(pane.title)}</div>
      <div class="term-actions">
        <button data-action="refresh" title="Re-run commands" aria-label="Refresh ${pane.id}">↻</button>
      </div>
    `;

    const body = document.createElement("div");
    body.className = "term-body";

    const pre = document.createElement("pre");
    pre.id = `output-${pane.id}`;
    body.appendChild(pre);

    term.appendChild(titlebar);
    term.appendChild(body);

    titlebar.querySelector('[data-action="refresh"]').addEventListener("click", () => {
      typeLines(pre, pane.lines(), pane.status);
    });

    return { term, pre };
  }

  function typeLines(pre, lines, statusItems) {
    pre.innerHTML = "";
    let i = 0;
    const delay = 28;

    function next() {
      if (i >= lines.length) {
        if (statusItems) {
          const row = document.createElement("div");
          row.className = "status-row";
          row.innerHTML = statusItems.map(s =>
            `<div class="status-chip"><div class="indicator ${s.color}"></div>${esc(s.label)}</div>`
          ).join("");
          pre.appendChild(row);
        }
        const cursorLine = document.createElement("div");
        cursorLine.className = "line cmd";
        cursorLine.innerHTML = `<span class="ps1">${PS1_PREFIX}$ </span><span class="cursor"></span>`;
        pre.appendChild(cursorLine);
        pre.parentElement.scrollTop = pre.parentElement.scrollHeight;
        return;
      }
      const line = lines[i];
      const div = document.createElement("div");
      div.className = `line ${line.type}`;
      div.innerHTML = line.html;
      pre.appendChild(div);
      pre.parentElement.scrollTop = pre.parentElement.scrollHeight;
      i++;
      setTimeout(next, line.type === "cmd" ? delay * 3 : delay);
    }
    next();
  }

  const grid = document.getElementById("grid");

  PANES.forEach((pane, idx) => {
    const { term, pre } = buildPane(pane);
    grid.appendChild(term);
    setTimeout(() => {
      typeLines(pre, pane.lines(), pane.status);
    }, idx * 400);
  });

  function updateClock() {
    const now = new Date();
    document.getElementById("clockLabel").textContent =
      now.toLocaleTimeString([], { hour:"2-digit", minute:"2-digit", second:"2-digit" });
  }
  updateClock();
  setInterval(updateClock, 1000);
})();
</script>
