<?xml version="1.0"?>
<!--
  Aquila design system -- system-wide font fallback for GUI apps (GTK/Qt/
  Electron/browsers) on this box. Not a console/TTY font -- see
  install-aquila-font.sh for that.

  Order: Aquila (brand font, only present if you supplied the licensed
  file yourself) -> Atkinson Hyperlegible (Braille Institute, designed for
  low-vision/dyslexic legibility) -> Lexend (shown in reading-fluency
  studies to reduce reading time) -> the system's prior default as final
  fallback.
-->
<fontconfig>
  <alias>
    <family>sans-serif</family>
    <prefer>
      <family>Aquila</family>
      <family>Atkinson Hyperlegible</family>
      <family>Lexend</family>
    </prefer>
  </alias>
  <alias>
    <family>system-ui</family>
    <prefer>
      <family>Aquila</family>
      <family>Atkinson Hyperlegible</family>
      <family>Lexend</family>
    </prefer>
  </alias>
  <match target="pattern">
    <test qual="any" name="family"><string>sans-serif</string></test>
    <edit name="family" mode="prepend" binding="strong">
      <string>Aquila</string>
      <string>Atkinson Hyperlegible</string>
    </edit>
  </match>
</fontconfig>
